# rules.yaml: [global-switches] [app-modes] [ignored-apps]
# 【只读】本文件编译期嵌入守护进程二进制（common::embedded_rules_str），运行时一律
# 读嵌入值：全局模式、应用性能模式等均由模块随附维护，WebUI 与磁盘文件改动均不影响
# 调度行为；本文件是启动时复制出的对外展示副本（common::sync_rules_snapshot）。

# [global-switches]
dynamic_enabled: true
global_mode: "default"

app_modes:
# Activity 级规则：键可写成 `pkg/.SomeActivity`（命中优先于同包名键，示例 `com.tencent.mm/.Chat`）。
# activity 由全局采样器在屏幕亮且有前台时按 3s 节流采样，普通应用同样生效；采不到时自动回退包名级。
#
# 【2026-10-22 首版下放】口径：**保留包名默认规则**（special_tuned.yaml 的 bili→playback、
# arknights→akmode 等一条不动），只在「性能不足」或「性能过于充裕」的 activity 上加覆盖。
# 证据 = sm8550 真机 devimp 包（logd_1022-031350，10-21→10-22，55926 条 tick），
# 判据：over_cores = 组内 util > up_threshold 的核数（性能不足信号），
#       under_cores = 组内 util < down_threshold 的核数（性能充裕信号），
#       freq/max = 决策选频 ÷ 硬件上限（贴顶程度）。样本 < 30 tick 的 activity 不入表。
# 注意：本段一旦出现含 '/' 的键，activity_aware 采样即整体启用（3s 节流 dumpsys），
# 这是 activity 级规则生效的前提，也是本机制的自耗成本。

  # --- 性能不足：组内多数核已过升频阈值、频率贴顶，默认档跟不上 ---
  # QQ 公共传输 Fragment：big 组 over 2.07 核/tick、util 0.87、freq/max 0.79（贴顶最狠的一项）
  com.tencent.mobileqq/.activity.QPublicTransFragmentActivity: boost
  # QQ 启动页：big over 0.72、util 0.70（启动阶段本身短，但连带的 JIT/资源加载都在这里）
  com.tencent.mobileqq/.activity.SplashActivity: boost
  # 小红书首页信息流：util 0.87、over 1.3、选频已到 2.13 GHz
  com.xingin.xhs/.index.v2.IndexActivityV2: boost
  # 千牛工作台首页：big over 0.48
  com.taobao.qianniu/com.qianniu.launcher.business.main.MainActivity: boost
  # 淘宝主界面：big over 0.45
  com.taobao.taobao/com.taobao.tao.TBMainActivity: boost

  # --- 性能过于充裕：长稳态、util 低而多数核空闲，可走省电档 ---
  # 淘宝商品详情页：little under 2.89 / big under 3.84 核/tick，util 仅 0.29-0.31；
  # 属长停留稳态页，压档不影响可感操作（滑动手势仍由触摸升频兜底）
  com.taobao.taobao/com.taobao.android.detail.alittdetail.TTDetailActivity: reduce

  # --- 颗粒度细化：同包内按 activity 分化，脱离包名默认档 ---
  # B 站包名正则 `re:(?i)(bilibili|danmaku\.bili)` 把**全部** activity 锁进 playback，
  # 但 playback 是给长稳态播放调的（util_smoothing 0.35 强平滑 + headroom 1.05 贴负载），
  # 首页信息流与搜索页是高频滚动/输入场景，强平滑会让升频滞后 → 只把这两类拉回 default，
  # 视频详情/Story/播放类 activity 继续走包名默认的 playback（不写即保留）。
  tv.danmaku.bili/.MainActivityV2: default
  tv.danmaku.bili/com.bilibili.search2.main.BiliMainSearchActivity: default

  # --- 包名级 reduce：整包只有长稳态一种形态，全包充裕 ---
  # 阅读器
  com.dragon.read: reduce
  # 阅读/书架
  com.example.pilinara: reduce

  # --- Activity 级 reduce：同包内只有这些页面充裕，其余保留包名默认 ---
  # 微信 VoIP 视频通话页
  com.tencent.mm/.plugin.voip.ui.VideoActivity: reduce
  # 酷安通用容器页（各类二级页共用）
  com.coolapk.market/.view.base.SimpleActivity: reduce

# [activity-params]
# Activity 级**参数**覆盖（2026-10-23 首版；机制见 src/monitor/config.rs 的 ActivityParamOverride）。
# 与上面的 app_modes **正交**：app_modes 决定「用哪套参数」（模式名），本段决定「在这套参数上再改哪几个字段」。
# 同一 activity 键可以两边都写（模式 + 微调），也可以只写本段（模式不变、只调参）。
# 限四个跨链路同义字段（CLG 与特调共用同一份配置）：
#   headroom        目标 = util × headroom（>1 留余量、<1 收紧；软收紧，仍可被负载顶到最高频）
#   util_smoothing  EMA 系数，1.0 = 不平滑（越小越滤尖峰）
#   hysteresis      特调死区 / CLG 写频死区（占硬件最高频比例）
#   down_hold_ms    降频保持（特调直接毫秒；CLG 按 tick 折算）
# 刻意不开 perf_ceil/perf_floor：天花板已在 2026-09-28 全局拆除，
# 「除特殊模式外任何情况下都能跑最高频」是硬约束，activity 级不能绕过它去封顶。
#
# 证据（logd_1023-011754，sm8550/PHB110，A02-14，放电 10727 样本）：
#   按包能量占比 incallui 49.9%（2.58W）、kernelsu 23.7%、QQ 16.9%、baiyang.eet 2.9%（3.65W，gpu 仅 2.1%）
activity_params:
  # --- com.android.incallui（通话界面，能量占比第一） ---
  # 形态：三簇实际上限远低于硬件顶（little 1112 / big 1580 / prime 742 MHz 均值），
  # 但 util 均值 little 0.59 / big 0.60 / prime 0.15，且 deb_up 峰值 63/82/100 —— 决策方向反复翻转。
  # 该界面是低频宽稳态（点按/滑动的瞬时尖峰多），把平滑收到 0.45 滤掉尖峰、
  # headroom 收到 0.95（不再外推余量），死区从缺省 0.85 段抬一档减少相邻档往复。
  com.android.incallui/.InCallActivity:
    util_smoothing: 0.45
    headroom: 0.95
    hysteresis: 0.06
  # 通话中的悬浮/会议子界面（VideoCall 与 Conference 共用同一负载形态，
  # 单独列出是因为两者 activity 名不同、且会议态往往同时有音频编码，负载更平）
  com.android.incallui/.VideoCallActivity:
    util_smoothing: 0.45
    headroom: 0.95
  # --- com.tencent.mobileqq（boost 模式，4.20W 为全批功耗密度最高） ---
  # boost 是宽松档（up_threshold 0.55、无稳态下探），实测该包 boost 段 1042 样本 4.20W、
  # 但 default 段（175 样本）4.48W —— 说明 boost 本身不是主因，是**负载在两类界面间切换**。
  # 只对 QQ 的聊天/联系人这类长停留 UI 收紧平滑（滚动+输入尖峰多），
  # 保留 boost 的响应性：headroom 不动（1.0 档已是 boost 语义），只滤尖峰。
  com.tencent.mobileqq/.activity.FriendProfileCardActivity:
    util_smoothing: 0.5
  com.tencent.mobileqq/.activity.ChatActivity:
    util_smoothing: 0.5
  # --- com.baiyang.eet（省钱主目标，见 special_tuned.yaml 的 sweet 组） ---
  # 该包整包走 sweet 特调模式（甜点硬封顶），参数已在 tuned_profiles.yaml 的 sweet 段；
  # 这里**不写**本包，避免两套覆盖叠加时口径难审计（特调接管期间 CLG 不活跃，本段对它无效）。

  # 阅读器主界面
  # 翻页是典型「短尖峰 + 长空闲」，平滑收到 0.35（比通用 0.5 更狠）、余量收到 0.95。
  com.dragon.read/.reader.ui.ReaderActivity:
    util_smoothing: 0.35
    headroom: 0.95
    hysteresis: 0.06
  # 阅读器书籍列表/主页
  com.dragon.read/.pages.main.MainFragmentActivity:
    util_smoothing: 0.45
    headroom: 1.0
  # 同上（书架类）
  com.example.pilinara/.MainActivity:
    util_smoothing: 0.4
    headroom: 0.95
  # 微信聊天主页（多机型形态不一致，故只调参不改模式）
  com.tencent.mm/.ui.chatting.variants.ChattingMainUI:
    util_smoothing: 0.45
    headroom: 0.95
  # 微信主界面
  com.tencent.mm/.ui.LauncherUI:
    util_smoothing: 0.5
    headroom: 0.95
  # Telegram 三开客户端主界面
  fork.risin42.nagramx/org.telegram.ui.LaunchActivity:
    util_smoothing: 0.5
    headroom: 0.95
  # 网易云播放页：只滤尖峰
  com.netease.cloudmusic/.activity.PlayerActivity:
    util_smoothing: 0.5
  # 剪映类编辑主页：导出尖峰多
  com.trim.app/.MainActivity:
    util_smoothing: 0.45
    headroom: 0.95

# [rollback] 改动回退三项（2026-10-24 第二批；缺一即视为未定义回退，不得排期）
# 本文件是**编译期嵌入**的只读副本（common::embedded_rules_str），改动要改 `module/rules.yaml` 源码本体、
# 重新构建才生效；WebUI 与磁盘副本改动均不影响调度行为。
# ① 可观测触发条件（写死指标，不写「变卡了」）：
#     · 流畅度：命中规则的 activity 所在批次，`dvmain.py` 的 `[7] 播放态帧间隔直方图` 长尾率
#       （>50 ms 帧占比）较改动前上移；FAS 段看 `status.csv` 的 `fps` 列 1% Low 下滑。
#     · 响应：首帧/启动时长（QQ/微信冷启动）在日志 `reason` 列出现持续 `up_wait` 堆叠。
#     · 功耗反向：命中包在 `dvpower.py` 的 `[2] 按 package 汇总` 里 avg W 不降反升，
#       或该 activity 的样本等效 Wh 占比上升。
# ② 可逆动作（字段级）：
#     · 撤单条 activity：`app_modes` 里删该键（自动回退包名级）、`activity_params` 里删该键（回退模式缺省参数）。
#     · 只撤收紧：把 `util_smoothing` 调回 0.5、`headroom` 调回 1.0（两个旋钮独立可逆）；
#       `hysteresis: 0.06` 删该行即回缺省（它是 ReaderActivity 一条额外抬的，非通用值）。
#     · 整批撤：删除本文件里所有「2026-10-24 第二批」段落，即回到第一批（2026-10-22/23）状态。
# ③ 回退后留档位置：
#     · 证据与规则清单：`devimpbin/a0214/REPORT-A02-14.md`（含每台机型原始读数与脚本命令）。
#     · 待裁决/已否决条目：`agentsdocs/07-todos.md`（TODO 唯一权威）。

# [ignored-apps]
ignored_apps:
  - com.android.systemui
