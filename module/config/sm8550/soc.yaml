# sm8550/soc.yaml: [topology] [capacity] [freq] [idle] [dpc] [cpu_governors] [frontier_policy]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# [topology]~[dpc] 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
# [cpu_governors] 例外之一：它是**选择偏好**（见下注释），其余段是硬件基线。
# [frontier_policy] 是例外：它是**策略表**（帕累托前沿结果向量），由
# scripts/frontier_policy.py 离线生成、受控块替换（块外内容勿手改本块）。
# 帕累托前沿概念算法具备采用条件（有逐档能效模型 + 实测 capacity）；其它无本段 SoC  →
# 天然走原逻辑。表缺失 / 指纹不符 / 桶越界时运行期一律回退既有参数组。改表必须重跑生成器。
soc: "sm8550"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# little A510 3 核 / big A715 4 核 / prime X3 1 核
topology:
  little: { start: 0, end: 3 }
  big: { start: 3, end: 7 }
  prime: { start: 7, end: 8 }

# [capacity] EAS capacity 兜底（真机 cpu_capacity 读不到时用）：
# 真机 FAS 日志实测 280/855/1024（出处未在厂商 DT 实证——本仓库不含真机设备树，
# 待真机 /proc/device-tree 或 dtb 反编译确证，见 .archive/.cursor/docs/kernel-analysis/device-todo.md T1）；
# mainline DT（mdocs/sm8550/sm8550.dtsi）参照 326/693/1024。**本表仅代表 8550 真机实测，其他 SoC 勿套用**——
# 算容量一律优先读各机型真机 cpu_capacity，本表只作 sysfs 读不到时的兜底。
capacity:
  little: 280
  big: 855
  prime: 1024

# [freq] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# 来源：mainline DT CPU OPP 表（mdocs/sm8550/sm8550.dtsi 458-753 行附近），
# 已与真机 scaling_available_frequencies 逐档核对一致（.archive/.codebuddy/docs/2026-09-26-sm8550-opp-ladder.md）。
# 写 scaling_max_freq 前必须 floor 对齐到表内档位（内核 clamp 向下取最近档）。
freq_khz:
