    big: { capacity: 1024, freq_khz: [449000, 546000, 676000, 757000, 845000, 962000, 1014000, 1144000, 1242000, 1352000, 1482000, 1586000, 1690000, 1794000, 1872000], power_w: [0.3490, 0.3662, 0.4101, 0.4541, 0.4823, 0.5278, 0.5916, 0.6518, 0.7171, 0.7954, 0.9612, 1.0417, 1.1661, 1.3610, 1.5075], single_core_power_w: [0.1163, 0.1221, 0.1367, 0.1514, 0.1608, 0.1759, 0.1972, 0.2173, 0.2390, 0.2651, 0.3204, 0.3472, 0.3887, 0.4537, 0.5025] }
