# [idle] 空闲态代价（µs，来自 zumapro-a1 dtb 的 idle-states，cpu-idle-states 已按核绑定）：
# little→hayes、big→hunter、prime→hunterelp。校准基准，本期无运行时消费方。
idle_us:
  exit_latency:
    little: 160
    big: 190
    prime: 220
  min_residency:
    little: 2000
    big: 2500
    prime: 3500

# [dpc] dynamic-power-coefficient（来自 zumapro-cpu.dtsi 的逐核属性）。校准基准，本期无运行时消费方。
# 原记录 70 / 513 / 757 已作废：那是 Tensor G3 的数。本机 DT 实际是 176 / 325 / 748。
dpc:
  little: 176
  big: 325
  prime: 748

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」（CLG / 特调 /
# PowerBase / FastLock / 残留清理共用）。不写本段或全不可用 → 沿用 schedutil。
# sched_pixel 是本机真机当前值（Google 自家的 cpufreq 调速器），排第一以贴近出厂行为；
# 若实测发现它与 CLG 的上限写入互相打架，把它删掉即回退 schedutil。
# 注意：performance 是兜底，放在最后一位防止前面所有调速器均不可用
cpu_governors: [sched_pixel, schedutil, performance]

