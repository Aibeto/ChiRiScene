      648000,
      787000,
      910000,
      1065000,
      1221000,
      1328000,
      1418000,
      1549000,
      1795000,
      1945000,
      2130000,
      2245000,
      2367000,
      2450000,
      2600000,
    ]
  # prime / policy7：18 档 700000-3105000
  prime:
    [
      700000,
      1164000,
      1396000,
      1557000,
      1745000,
      1885000,
      1999000,
      2147000,
