  # 各簇频表 + 逐档**簇功耗**(W)：功耗列由 devimpbin/batch_ingest.py 从 freqbench_tensor
  # 实测折算（净动态、已做漏电校正），**只能用于相对排序**；档位与 freq_khz 逐档对齐。
  per_cluster:
    little: { capacity: 1024, freq_khz: [960000, 1094400, 1248000, 1344000, 1401000, 1497600], power_w: [0.9339, 1.0935, 1.4849, 1.6727, 1.7758, 1.7779] }
    big: { capacity: 884, freq_khz: [768000, 902400, 998400, 1094400, 1209600], power_w: [0.7120, 0.8645, 1.1612, 1.3538, 1.4397] }
  # 需求桶: lo_units/hi_units 是真机容量单位边界；三簇 kHz 是查表落点（运行期仍需 floor 对齐）
  demand_buckets:
    - { point: 0, lo_units: 4870.7, hi_units: 5067.2, little_khz: 960000, big_khz: 768000, prime_khz: 0, target_compute: 22444.0, target_power_w: 1.6459, margin_mdmips_per_w: 11362.0 }
    - { point: 1, lo_units: 5067.2, hi_units: 5447.4, little_khz: 960000, big_khz: 902400, prime_khz: 0, target_compute: 24176.7, target_power_w: 1.7984, margin_mdmips_per_w: 10940.5 }
    - { point: 2, lo_units: 5447.4, hi_units: 6080.2, little_khz: 1094400, big_khz: 902400, prime_khz: 0, target_compute: 25922.8, target_power_w: 1.958, margin_mdmips_per_w: 6959.7 }
    - { point: 3, lo_units: 6080.2, hi_units: 6948.5, little_khz: 1094400, big_khz: 1209600, prime_khz: 0, target_compute: 29926.0, target_power_w: 2.5332, margin_mdmips_per_w: 5849.9 }
