# sm8750/soc.yaml: [topology] [freq] [cpu_governors] [frontier_policy]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
#
# 机型 = OnePlus 13（PJZ110）/ Qualcomm SM8750（骁龙 8 Elite）。
# 目录按 SoC 型号命名 sm8750（与其余机型同构）。另保留平台代号 `sun` 作为**别名**
# （真机 ro.board.platform=sun，见 devimp main_ 头 `board=sun`），由 common.rs 的
# `soc_hint_config_name()` 归一映射到本目录——部分机型只暴露 board 名、不暴露 ro.soc.model。
soc: "sm8750"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 8750 是 **两簇** 布局，没有独立小核簇：6× Oryon「performance」核（CPU0-5，policy0，
# 384000-3532800 kHz）+ 2× Oryon「prime」核（CPU6-7，policy6，1017600-4320000 kHz）。
# 八核同为 64 位 Oryon，DT 里 cpu0-5 共享 l2_0/scmi_dvfs 0、cpu6-7 共享 l2_1/scmi_dvfs 1。
#
# 三槽口径映射：little = 空区间（本机没有能效小核，故不占任何 CPU ID）、
# big = CPU0-5（perf 六核）、prime = CPU6-7。空区间是合法值：core_group_of 永不命中
# little，CLG 按 policy 归组时 policy0 → big、policy6 → prime（cpu_load_governor 的
# cluster 命名判据是「affected_cpus 是否命中该区间」）。**三槽必须同时给出**，
# 缺任一段 chiri_core_ranges 会整段回退到硬编码兜底（0..3/3..7/7..8，对本机全错）。
topology:
  little: { start: 0, end: 0 }
  big: { start: 0, end: 6 }
  prime: { start: 6, end: 8 }

# [freq_khz] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# 来源 = **真机实测**（devimp main_ 的 cpu_cur_khz/cpu_max_khz 逐档反解，A02-11 包，
# 2026-10-19~20 共 3.2 万行 snap）。每簇各 16 档，与原厂 EPSS LUT 一致。
# 厂商 dtsi 无 CPU OPP 表（`sm8750.dtsi` 不含 cpu*_opp_table，电压在 EPSS 硬件 LUT 里），
# 故本表只能来自真机 sysfs，不能像 8650 那样抄 DT。写 scaling_max_freq 前须 floor 对齐。
freq_khz:
  # little：空表 = 本机无小核簇（与 topology 空区间一致，勿填任何档位）
  little: []
  # big / policy0（CPU0-5）：16 档 384000-3532800
  big:
    [
      384000,
      556800,
      748800,
      960000,
      1152000,
      1363200,
      1555200,
      1785600,
      1996800,
      2227200,
      2400000,
      2745600,
      2918400,
      3072000,
      3321600,
      3532800,
    ]
  # prime / policy6（CPU6-7）：16 档 1017600-4320000
  prime:
    [
      1017600,
      1209600,
      1401600,
      1689600,
      1958400,
      2246400,
      2438400,
      2649600,
      2841600,
      3072000,
      3283200,
      3513600,
      3801600,
      4089600,
      4204800,
      4320000,
    ]

# [cpu_governors] cpufreq 调速器优先级表（从左到右；与真机 scaling_available_governors
# 求交后取首个，全不匹配回落 schedutil）。
# 取值与其余 38 个机型**完全一致**（uag 优先）：这是仓库长期验证的统一口径，不为新机型开特例。
# 8e 真机 devimp 的 cpu_governor 列当时显示 policy0:walt / policy6:walt，但那只是**当时生效值**，
# 推不出优先级——uag 不可用或启动期节点未就绪都会落到 walt；且表里写了不存在的项只会白排
# （pick_governor 求交后跳过），不会出错。
# TODO: 真机 `cat /sys/devices/system/cpu/cpufreq/policy0/scaling_available_governors` 确认
# 该 GKI 内核是否带 oplus 的 uag；若确实不带，本表自然落到 walt，无需改。
cpu_governors: [uag, walt, schedutil, performance]

# [capacity] EAS capacity 兜底（真机 cpu_capacity 读不到时用；真机 sysfs 永远优先）。
# 来源 = 能效曲线V2 图表的单核峰值分数比：OryonV2-L 16.90 / OryonV2-M 10.28 = 1.644，
# 按 capacity ∝ S_max / f_max 折算（L 4320 MHz、M 3533 MHz），归一化到 prime = 1024
# → big = 1024 × (10.28/3532.8) / (16.90/4320) ≈ 762。
# little 不给：本机没有小核簇（topology 空区间），给了反而会让 core_group_of 之外的回退路径混乱。
capacity:
  big: 762
  prime: 1024

# [idle] / [dpc] 两段**刻意留空**（不是遗漏）：
# 本机 DT 无 capacity-dmips-mhz / dynamic-power-coefficient / cpu-idle-states
# （`sm8750.dtsi` 无 CPU OPP 表、无 qcom,freq-domain），原厂内核 6.6.89 GKI 也不带
# 静态 OPP。三段均为「兜底」语义：真机 sysfs（cpu_capacity）永远优先，缺失时
# 才取本表；凭空填推断值会让 PF 需求折算与能耗模型带上假基线，比留空更危险。
# 待真机 `cat /sys/devices/system/cpu/cpu*/cpu_capacity` 与 energy_model 取证后再补。

# [frontier_policy] 参考能效曲线（本机只有参考曲线、无 §3 实测表，故本节是唯一能效数据源）
#
# 与 8550/8650 的完整帕累托前沿不同：本机拿不到逐档实测簇功耗与完整能效曲线，
# 只有「参考功耗 + 参考电压」构成的参考能效曲线，故本段只描述每簇参考锚点，
# 运行期由 src/chiri/frontier_lite.rs 按**边际能效**在线选点（不落需求桶）。
# 字段命名一律带 Lite 后缀，日志键用 `*-Lite`，与 CLG-PF / FDP 明确区分。
#
# 【当前状态：enabled = false，锚点待补】2026-10-22 取证结论：
#   - 原厂内核（OnePlus PJZ110_16.0.9.401 / QCOM PLATFORM.4.0.R1）**无 CPU OPP 表**：
#     `sm8750.dtsi` 不含 cpu*_opp_table / capacity-dmips-mhz / dynamic-power-coefficient，
#     电压在 EPSS 硬件 LUT 里（`qcom-cpufreq-hw.c` 的 qcom_cpufreq_hw_read_lut 运行时注入）；
#   - 本次会话 web 检索不可用（API 鉴权失败），未能取证任何公开的 8750 参考电压/功耗表。
# 因此**不填任何推断值**：凭空参考曲线会让选点排序带上假基线，比留空更危险。
# 取证途径（任一即可）：
#   a) 真机 `cat /sys/kernel/debug/energy_model/cpu*/ps:*/{power,cost}`（需 root + debugfs）
#   b) 真机 EPSS LUT 导出：`/sys/kernel/debug/opp/opp_summary` 或 cpufreq-hw 的 volt_lut
#   c) 公开补丁：搜 `sm8750 cpufreq opp` / `sun dtsi oryon` 的 linux-arm-msm 提交
# 数据到手后**不要手改本段**，走生成器（受控块替换）：
#   python3 scripts/frontier_policy_lite.py --soc sun --input <anchors.yaml> --write
#   python3 scripts/frontier_policy_lite.py --soc sun --input <anchors.yaml> --check

# >>> frontier_policy (generated) >>>
# 由 scripts/frontier_policy.py 生成；受控块替换，块外内容请勿手改本块
