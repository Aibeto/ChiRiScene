#       前沿/下凸包/需求桶/三模式算法与标准版**逐行相同**，差别只在功耗列的来源（参考模型 vs §3 实测）
# 运行期: 只查表落点与逐档功耗（不重算 Cx·f·V²）；表缺失/指纹不符/桶越界 → 回退既有参数组
frontier_policy:
  enabled: true
