# 8650/soc.yaml: [topology] [capacity] [freq] [idle] [dpc] [cpu_governors]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
soc: "8650"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 8650 是 2+3+2+1 四 policy 布局：little A520（CPU0-1）/ big A720（CPU2-4）+ A720（CPU5-6）
# / prime X4（CPU7）。两组 A720 各占一个 policy，ChiRi 的三组口径把它们并进 big（2..7）。
topology:
  little: { start: 0, end: 2 }
  big: { start: 2, end: 7 }
  prime: { start: 7, end: 8 }

# [capacity] 本地无该机型 dtsi，capacity 以真机 sysfs（cpu_capacity）为准。
# TODO: 取到真机 cpu_capacity 或板级 DTS 后补三簇值（厂商板级覆盖常见，勿照抄 mainline DT）。
# 影响面：仅帕累托前沿的需求折算与 FDP 用兜底值，本机无 frontier_policy，当前不受影响。

# [freq] 本地无该机型 dtsi，频率档位以真机 sysfs（scaling_available_frequencies）为准。
# TODO: 取到真机频表后补三簇档位；写 scaling_max_freq 前须 floor 对齐到表内档位。

# [idle] 本地无该机型 dtsi，暂无 idle-state 代价数据。

# [dpc] 本地无该机型 dtsi，暂无 dynamic-power-coefficient 数据。

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」（CLG / 特调 /
# PowerBase / FastLock / 残留清理共用）。不写本段或全不可用 → 沿用 schedutil。
# 注意：performance 是兜底，放在最后一位防止前面所有调速器均不可用
cpu_governors: [uag, walt, schedutil, performance]
