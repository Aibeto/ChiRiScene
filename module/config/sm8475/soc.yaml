# sm8475/soc.yaml: [topology] [capacity] [freq] [idle] [dpc] [cpu_governors]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
soc: "sm8475"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 8475 布局：little 4 核（0-3）/ big 3 核（4-6）/ prime 1 核（7，X2）。
# 注意与 8550 不同（8550 是 little 0..3 / big 3..7 / prime 7..8），勿混淆。
topology:
  little: { start: 0, end: 4 }
  big: { start: 4, end: 7 }
  prime: { start: 7, end: 8 }

# [capacity] EAS capacity 兜底（真机 cpu_capacity 读不到时用；真机 sysfs 永远优先）。
# 来源 = 厂商 dtsi `cape.dtsi` 的 `capacity-dmips-mhz`：little 1024 / big 2253 / prime 2386
# （A710 ×3 与 X2 ×1）。**注意**：这是厂商 DT 口径，8550 的教训是厂商板级 DT 常与真机
# `cpu_capacity` 不符（8550 DT 326/693/1024 vs 真机 280/855/1024），故本表只作 sysfs
# 读不到时的兜底；真机可读即以真机值为准。
capacity:
  little: 1024
  big: 2253
  prime: 2386

# [freq_khz] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# **本机型 dtsi 无静态 CPU OPP 表**：`cape.dtsi` 的 `qcom,freq-domain = <&cpufreq_hw N 4>`
# 只给簇编号，频表由 cpufreq-hw EPSS 硬件 LUT 运行时注册（与 sm8650 的厂商 dtsi 不同，
# 后者含静态 OPP 表）。故本段暂缺 → 调用方走真机 `scaling_available_frequencies`；
# 补法 = 真机采样或另找含 `qcom,cpufreq-table` 的板级 dtsi。
# 写 scaling_max_freq 前须 floor 对齐到表内档位。

# [idle] 空闲态代价（µs，厂商 dtsi `cape.dtsi` 的 idle-states；校准基准）。
# silver-c4 / gold-c4 为 per-CPU 态，cluster-d4 / cluster-e3 为簇态。
# 三簇的 exit_latency 按各自 CPU 态取：little = silver-c4 exit 750（entry 800），
# big = gold-c4 exit 1550（entry 600）；prime 与 big 同簇级、取 gold-c4 同类口径。
idle_us:
  exit_latency: { little: 750, big: 1550, prime: 1550 }
  min_residency: { little: 4090, big: 4791, prime: 4791 }
  cluster_exit_latency: [2500, 3500] # cluster-d4 / cluster-e3

# [dpc] dynamic-power-coefficient（厂商 dtsi `cape.dtsi`；校准基准，暂无运行时消费方）。
dpc: { little: 100, big: 257, prime: 509 }

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」（CLG / 特调 /
# FastLock / 残留清理共用）。不写本段或全不可用 → 沿用 schedutil。
# 注意：performance 是兜底，放在最后一位防止前面所有调速器均不可用
cpu_governors: [uag, walt, schedutil, performance]
