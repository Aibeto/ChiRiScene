    big: { capacity: 1024, freq_khz: [936000, 1040000, 1144000, 1248000, 1352000, 1456000, 1508000, 1664000, 1768000, 1898000, 1976000, 2080000, 2184000, 2210000, 2314000], power_w: [0.6131, 0.6879, 0.7971, 0.8914, 1.0404, 1.1698, 1.2704, 1.6166, 1.9074, 2.3095, 2.7279, 3.2272, 3.7152, 4.1564, 4.9315], single_core_power_w: [0.1533, 0.1720, 0.1993, 0.2228, 0.2601, 0.2924, 0.3176, 0.4042, 0.4768, 0.5774, 0.6820, 0.8068, 0.9288, 1.0391, 1.2329] }
