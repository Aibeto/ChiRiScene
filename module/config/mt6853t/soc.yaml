    big: { capacity: 1024, freq_khz: [725000, 840000, 898000, 985000, 1042000, 1129000, 1274000, 1418000, 1534000, 1650000, 1837000, 1993000, 2118000, 2210000, 2306000, 2400000], power_w: [0.2529, 0.3069, 0.3321, 0.3508, 0.3858, 0.3838, 0.4792, 0.5218, 0.6131, 0.6870, 0.8021, 0.9405, 1.0969, 1.1812, 1.2595, 1.3420], single_core_power_w: [0.1265, 0.1535, 0.1661, 0.1754, 0.1929, 0.1919, 0.2396, 0.2609, 0.3065, 0.3435, 0.4011, 0.4703, 0.5484, 0.5906, 0.6298, 0.6710] }
