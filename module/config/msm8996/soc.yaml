# msm8996/soc.yaml: [topology] [capacity] [freq_khz] [cpu_governors] [frontier_policy]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
# 本文件由 devimpbin/gen_soc_config.py 从 freqbench_tensor 实测批量生成；
# [frontier_policy] 是例外（策略表，由 scripts/frontier_policy.py 生成，块外勿手改）。
soc: "msm8996"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 数据源 = 该机型 results.json 的 cpufreq policy 首核（实测，不是周期表抄写）：
# little：cpus 0-1（2 核）
# big：cpus 2-3（2 核）
# prime：本机型无该簇（空区间）
topology:
  little: { start: 0, end: 2 }
  big: { start: 2, end: 4 }
  prime: { start: 0, end: 0 }   # start == end：本机型无该簇

# [capacity] EAS capacity 兜底（真机 cpu_capacity 读不到时用；真机 sysfs 永远优先）。
# 取值 = 实测 coremarks_per_mhz(f_max) × f_max 归一到最高簇 1024；
# 与控制侧算力权重同口径（相对值），不是绝对分。真机 cpu_capacity 一旦可读即被覆盖。
capacity:
  little: 763
  big: 1024

# [freq_khz] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# 来源 = freqbench 逐档实测，与 mdocs/msm8996/msm8996-freq-power.md §3 表逐档一致
# （生成器会断言档位数；写 scaling_max_freq 前须 floor 对齐到表内档位）。
