# sm8850/soc.yaml: [topology] [freq] [cpu_governors] [capacity]
# 机型 = Xiaomi 17 Pro Max（popsicle / 2509FPN0BC）/ Qualcomm SM8850（8 Elite Gen 5）
# 数据来源：真机只读摸底 2026-11-21（reports/adapt/20261121-sm8850-probe.txt）
soc: "sm8850"

# [topology] 两簇：6x Oryon M（CPU0-5，policy0）+ 2x Oryon L（CPU6-7，policy6）
# 三槽口径映射：little=空区间（本机无能效小核）；big=CPU0-5；prime=CPU6-7。
topology:
  little: { start: 0, end: 0 }
  big: { start: 0, end: 6 }
  prime: { start: 6, end: 8 }

