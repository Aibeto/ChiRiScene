# sm8850/soc.yaml: [topology] [freq] [cpu_governors] [frontier_policy]
# 机型 = Xiaomi 17 Pro Max（popsicle / 2509FPN0BC），Qualcomm SM8850（Snapdragon 8 Elite Gen 5）
# 数据来源：真机实测（qpt PMIC 逐轨测量，v7+v8 共 55 点×3 轮，2026-11-24）
soc: "sm8850"

# [topology] 两簇：6x Oryon M（CPU0-5，policy0）+ 2x Oryon L（CPU6-7，policy6）
# 三档口径映射：little=空区间；big=CPU0-5；prime=CPU6-7
topology:
  little: { start: 0, end: 0 }
  big: { start: 0, end: 6 }
  prime: { start: 6, end: 8 }

# [freq_khz] 真机 scaling_available_frequencies（2026-11-21 实测，升序）
freq_khz:
  little: []
  big:
    [
      384000, 537600, 691200, 787200, 883200, 998400, 1113600, 1228800,
      1324800, 1440000, 1555200, 1670400, 1785600, 1900800, 1996800, 2112000,
      2227200, 2361600, 2496000, 2611200, 2745600, 2899200, 3033600, 3187200,
      3302400, 3398400, 3513600, 3628800
    ]
  prime:
    [768000, 883200, 1017600, 1132800, 1267200, 1382400, 1497600, 1632000,
      1747200, 1862400, 1977600, 2112000, 2227200, 2438400, 2668800, 2880000,
      3129600, 3398400, 3648000, 3763200, 3859200, 3974400, 4070400, 4185600,
      4262400, 4339200, 4396800, 4512000, 4608000]

# [cpu_governors] 与 sm8750 同构（CLG 按 policy 归组）
cpu_governors: [uag, walt, schedutil, performance]
# [capacity] 单核相对算力（真机 cpu_capacity，sysfs 优先；缺省才用本段兜底）
capacity:
  big: 762
  prime: 1024


