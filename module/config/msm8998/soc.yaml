# [idle] 空闲态代价（µs，厂商 dtsi `msm8998.dtsi` 的 idle-states；校准基准）。
# 每簇两级 per-CPU 态，本表取 sleep_1（深一级，实际驻留才进入）的 exit/min_residency：
# little = cpu-sleep-0-1 exit 4562（entry 814）；big = cpu-sleep-1-1 exit 2027（entry 724）。
# 浅态 sleep_0 的 exit 仅 86/82 µs、min_residency 504/1302 µs。
idle_us:
  exit_latency: { little: 4562, big: 2027 }
  min_residency: { little: 9183, big: 9419 }

# [dpc] dynamic-power-coefficient：**本机型 dtsi 未声明该属性**（4.4 内核时代 DT 不用
# EAS 的 dpc 口径），故本段缺省 → 无运行时消费方，仅不参与校准。

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」。
# 未真机核实，取高通系通用表；performance 垫底防前面全部不可用。
cpu_governors: [uag, walt, schedutil, performance]

