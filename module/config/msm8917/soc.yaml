# msm8917/soc.yaml: [topology] [capacity] [freq_khz] [cpu_governors] [frontier_policy]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
# 本文件由 devimpbin/gen_soc_config.py 从 freqbench_tensor 实测批量生成；
# [frontier_policy] 是例外（策略表，由 scripts/frontier_policy.py 生成，块外勿手改）。
soc: "msm8917"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 数据源 = 该机型 results.json 的 cpufreq policy 首核（实测，不是周期表抄写）：
# little：cpus 0-3（4 核）
# big：本机型无该簇（空区间）
# prime：本机型无该簇（空区间）
topology:
  little: { start: 0, end: 4 }
  big: { start: 0, end: 0 }   # start == end：本机型无该簇
  prime: { start: 0, end: 0 }   # start == end：本机型无该簇

# [capacity] EAS capacity 兜底（真机 cpu_capacity 读不到时用；真机 sysfs 永远优先）。
# 取值 = 实测 coremarks_per_mhz(f_max) × f_max 归一到最高簇 1024；
# 与控制侧算力权重同口径（相对值），不是绝对分。真机 cpu_capacity 一旦可读即被覆盖。
capacity:
  little: 1024

# [freq_khz] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# 来源 = freqbench 逐档实测，与 mdocs/msm8917/msm8917-freq-power.md §3 表逐档一致
# （生成器会断言档位数；写 scaling_max_freq 前须 floor 对齐到表内档位）。
freq_khz:
  # little / policy1：4 档 960000-1401000
  little:
    [
      960000,
      1094400,
      1248000,
      1401000,
    ]

# [idle] / [dpc] 本机型无本地 dtsi，暂无该数据；缺段 = None → 调用方走原有回退路径。

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」。
# 未真机核实，取高通系通用表；performance 垫底防前面全部不可用。
cpu_governors: [uag, walt, schedutil, performance]

# >>> frontier_policy (generated) >>>
# 由 scripts/frontier_policy.py 生成；受控块替换，块外内容请勿手改本块
# 口径: 能效模型 mdocs/msm8917/msm8917-freq-power.md §3 簇级表 + 本文件 capacity/freq_khz
# 运行期: 只查表落点与逐档功耗（不重算 Cx·f·V²）；表缺失/指纹不符/桶越界 → 回退既有参数组
frontier_policy:
  enabled: true
  model_fingerprint: "edb50620721b05e3"
  # TODO 待拍板: reserve_pct（流畅度下界）与 lead_frac（预判基准提前量）仍为占位值；
  # 真机观察后重跑本脚本覆盖（--reserve / --lead-frac），不要手改本块。
  # 无独立公布值可对账：本机型不设 anchors 段（实测折算表，逐档见能效模型文档 §3）
  # 前沿点（3 点；compute=CMdmips(CoreMark 实测折算)、power=W）
  frontier:
    - { compute: 12469.6, power_w: 0.8491 }
    - { compute: 14215.0, power_w: 1.0434 }
    - { compute: 18206.0, power_w: 1.8436 }
  # 各簇频表 + 逐档**簇功耗**(W)：功耗列由 devimpbin/batch_ingest.py 从 freqbench_tensor
  # 实测折算（净动态、已做漏电校正），**只能用于相对排序**；档位与 freq_khz 逐档对齐。
  per_cluster:
    little: { capacity: 1024, freq_khz: [960000, 1094400, 1248000, 1401000], power_w: [0.8491, 1.0434, 1.4769, 1.8436] }
  # 需求桶: lo_units/hi_units 是真机容量单位边界；三簇 kHz 是查表落点（运行期仍需 floor 对齐）
  demand_buckets:
    - { point: 0, lo_units: 2806.7, hi_units: 3003.1, little_khz: 960000, big_khz: 0, prime_khz: 0, target_compute: 12469.6, target_power_w: 0.8491, margin_mdmips_per_w: 8983.0 }
    - { point: 1, lo_units: 3003.1, hi_units: 3647.8, little_khz: 1094400, big_khz: 0, prime_khz: 0, target_compute: 14215.0, target_power_w: 1.0434, margin_mdmips_per_w: 4987.5 }
    - { point: 2, lo_units: 3647.8, hi_units: 4096.0, little_khz: 1401000, big_khz: 0, prime_khz: 0, target_compute: 18206.0, target_power_w: 1.8436, margin_mdmips_per_w: 0.0 }
  # 三模式结果向量（lead_mult 已定: reduce 0.5 / default 1.0 / boost 2.0）
  modes:
    reduce:
      lead_mult: 0.5
      lead_frac: 0.15
      reserve_pct: 0.0
      buckets:
        - { point: 0, target_compute: 12469.6, target_power_w: 0.8491, enter_units: 29.5, exit_units: 29.5 }
        - { point: 1, target_compute: 14215.0, target_power_w: 1.0434, enter_units: 96.7, exit_units: 96.7 }
        - { point: 2, target_compute: 18206.0, target_power_w: 1.8436, enter_units: 67.2, exit_units: 67.2 }
    default:
      lead_mult: 1.0
      lead_frac: 0.3
      reserve_pct: 0.1
      buckets:
        - { point: 0, target_compute: 12469.6, target_power_w: 0.8491, enter_units: 58.9, exit_units: 58.9 }
        - { point: 1, target_compute: 14215.0, target_power_w: 1.0434, enter_units: 193.4, exit_units: 193.4 }
        - { point: 2, target_compute: 18206.0, target_power_w: 1.8436, enter_units: 134.5, exit_units: 134.5 }
    boost:
      lead_mult: 2.0
      lead_frac: 0.6
      reserve_pct: 0.25
      buckets:
        - { point: 0, target_compute: 12469.6, target_power_w: 0.8491, enter_units: 117.8, exit_units: 117.8 }
        - { point: 1, target_compute: 14215.0, target_power_w: 1.0434, enter_units: 386.8, exit_units: 386.8 }
        - { point: 2, target_compute: 18206.0, target_power_w: 1.8436, enter_units: 268.9, exit_units: 268.9 }
  # 预判交叠带: 上升沿/下降沿共用同一组提前量（enter=exit），单位=真机容量单位
  anticipate:
    min_dwell_ticks: 20
    adjacent_only: true
    mode_mul: { reduce: 0.5, default: 1.0, boost: 2.0 }
