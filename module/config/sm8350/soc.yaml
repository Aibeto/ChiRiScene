      1401600,
      1497600,
      1612800,
      1708800,
      1804800,
    ]
  # big / policy4：16 档 710400-2419200
  big:
    [
      710400,
      844800,
      960000,
      1075200,
      1209600,
      1324800,
      1440000,
      1555200,
      1670400,
      1766400,
      1881600,
      1996800,
      2112000,
      2227200,
      2342400,
      2419200,
    ]
  # prime / policy7：19 档 844800-2841600
