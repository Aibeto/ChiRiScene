# [idle] 空闲态代价（µs，厂商 dtsi；校准基准，暂无运行时消费方）。
# 本机型 dtsi 只声明单级 per-CPU 态（A520/A720/X4 同用 cpu-sleep-0-0，不分组）+
# 单级簇态，故三簇同值。
idle_us:
  exit_latency: { little: 750, big: 750, prime: 750 }
  min_residency: { little: 6700, big: 6700, prime: 6700 }
  cluster_exit_latency: [2350] # cluster-sleep-0

# [dpc] dynamic-power-coefficient（厂商 dtsi 的 `dynamic-power-coefficient`；校准基准）。
dpc: { little: 100, big: 238, prime: 588 }

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」（CLG / 特调 /
# FastLock / 残留清理共用）。不写本段或全不可用 → 沿用 schedutil。
# 真机可用集合（pineapple defconfig）：schedutil（默认）/ performance / powersave /
# conservative + uag（OPlus 模块 cpufreq_uag.ko，真机当前值）；walt 在本内核不是调速器
# （CONFIG_SCHED_WALT 是调度器模块），列在中间只为与其它机型同表、永不命中。
# 注意：performance 是兜底，放在最后一位防止前面所有调速器均不可用
cpu_governors: [uag, walt, schedutil, performance]
