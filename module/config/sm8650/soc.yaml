# sm8650/soc.yaml: [topology] [capacity] [freq] [idle] [dpc] [cpu_governors] [frontier_policy]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
#
# 参考内核 = **common**（android.googlesource.com/kernel/common，android-mainline 分支）：
# `common/arch/arm64/boot/dts/qcom/sm8650.dtsi`。此前用厂商件 `AYNTechnologies/linux/.../sm8650.dtsi`，
# 2026-10-23 起改以 common 为准（用户指定）。两者实测对账结论：
#   * `cpu{0,2,5,7}_opp_table` **逐档完全相同**（little 25 档 307200-2265600、big 47 档
#     460800-3148800、prime 49 档 480000-3302400）→ `[freq_khz]` 两版一致，无需改值。
#   * `dynamic-power-coefficient` **相同**（100 / 238 / 588）→ `[dpc]` 无需改值。
#   * `capacity-dmips-mhz` **不同**：common = 1024 / 2909 / 3591，厂商 = 1024 / 1792 / 1894。
#     两版都**不用**：`[capacity]` 取真机 `cpu_capacity` 归一值（379 / 923 / 1024，见下），
#     真机 sysfs 在运行期永远优先于本表，DT 的 dmips 值是 EAS 拓扑标定口径、与 ChiRi 不同源。
soc: "sm8650"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 8650 是 2+3+2+1 四 policy 布局：little A520（CPU0-1）/ big A720（CPU2-4）+ A720（CPU5-6）
# / prime X4（CPU7）。两组 A720 各占一个 policy，ChiRi 的三组口径把它们并进 big（2..7）。
topology:
  little: { start: 0, end: 2 }
  big: { start: 2, end: 7 }
  prime: { start: 7, end: 8 }

# [capacity] EAS capacity 兜底（真机 cpu_capacity 读不到时用；真机 sysfs 永远优先）。
# 真机值（PJX110，FAS 自动算力权重日志逐 policy 读 cpu_capacity）：little 379、prime 1024；
# big 组跨两个 policy（CPU2-4 = 923、CPU5-6 = 867），本表只有三个槽，取较高者。
capacity:
  little: 379
  big: 923
  prime: 1024

# [freq_khz] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# 来源 = **common** 内核 `arch/arm64/boot/dts/qcom/sm8650.dtsi` 的静态 CPU OPP 表
# （`cpu{0,2,5,7}_opp_table`），非 EPSS 运行时 LUT。与厂商 AYN 版逐档完全相同（2026-10-23 对账）。
# 本机型是 2+3+2+1 四 policy 布局，本表三槽按三簇口径归并：big 组横跨 cpu2-4 与 cpu5-6
# 两个 policy，而两者阶梯逐档完全相同（47 档 460800-3148800 kHz），取其一即可。
# 写 scaling_max_freq 前须 floor 对齐到表内档位。
# ⚠ EEM 的 frontier_policy.per_cluster.freq_khz 必须与本段逐档一致：EEM 返回的 kHz
#   直接写 scaling_max_freq、不经 find_floor_freq 对齐（cpu_load_governor.rs:715-728）。
