    - { compute: 16934.8, power_w: 0.411 }
    - { compute: 26929.1, power_w: 0.6769 }
    - { compute: 43863.5, power_w: 1.4986 }
    - { compute: 52373.8, power_w: 2.4687 }
  # 各簇频表 + 逐档**簇功耗**(W)：功耗列由 devimpbin/batch_ingest.py 从 freqbench_tensor
  # 实测折算（净动态、已做漏电校正），**只能用于相对排序**；档位与 freq_khz 逐档对齐。
  per_cluster:
    little: { capacity: 1024, freq_khz: [652800, 1036800, 1401600, 1689600, 1804800, 1958400, 2016000], power_w: [0.4110, 0.6769, 1.1609, 1.4986, 2.0654, 2.3099, 2.4687] }
  # 需求桶: lo_units/hi_units 是真机容量单位边界；三簇 kHz 是查表落点（运行期仍需 floor 对齐）
  demand_buckets:
    - { point: 0, lo_units: 2652.6, hi_units: 3432.8, little_khz: 652800, big_khz: 0, prime_khz: 0, target_compute: 16934.8, target_power_w: 0.411, margin_mdmips_per_w: 37586.7 }
    - { point: 1, lo_units: 3432.8, hi_units: 5539.4, little_khz: 1036800, big_khz: 0, prime_khz: 0, target_compute: 26929.1, target_power_w: 0.6769, margin_mdmips_per_w: 20609.0 }
    - { point: 2, lo_units: 5539.4, hi_units: 7528.8, little_khz: 1689600, big_khz: 0, prime_khz: 0, target_compute: 43863.5, target_power_w: 1.4986, margin_mdmips_per_w: 8772.6 }
    - { point: 3, lo_units: 7528.8, hi_units: 8192.0, little_khz: 2016000, big_khz: 0, prime_khz: 0, target_compute: 52373.8, target_power_w: 2.4687, margin_mdmips_per_w: 0.0 }
