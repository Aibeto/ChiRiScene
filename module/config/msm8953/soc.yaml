# 口径: 能效模型 mdocs/msm8953/msm8953-freq-power.md §3 簇级表 + 本文件 capacity/freq_khz
# 运行期: 只查表落点与逐档功耗（不重算 Cx·f·V²）；表缺失/指纹不符/桶越界 → 回退既有参数组
