# sdm710/soc.yaml: [topology] [capacity] [freq_khz] [cpu_governors] [frontier_policy]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
# 本文件由 devimpbin/gen_soc_config.py 从 freqbench_tensor 实测批量生成；
# [frontier_policy] 是例外（策略表，由 scripts/frontier_policy.py 生成，块外勿手改）。
soc: "sdm710"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 数据源 = 该机型 results.json 的 cpufreq policy 首核（实测，不是周期表抄写）：
# little：cpus 0-5（6 核）
# big：cpus 6-7（2 核）
# prime：本机型无该簇（空区间）
topology:
  little: { start: 0, end: 6 }
  big: { start: 6, end: 8 }
  prime: { start: 0, end: 0 }   # start == end：本机型无该簇

# [capacity] EAS capacity 兜底（真机 cpu_capacity 读不到时用；真机 sysfs 永远优先）。
# 取值 = 实测 coremarks_per_mhz(f_max) × f_max 归一到最高簇 1024；
# 与控制侧算力权重同口径（相对值），不是绝对分。真机 cpu_capacity 一旦可读即被覆盖。
capacity:
  little: 473
  big: 1024

# [freq_khz] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# 来源 = freqbench 逐档实测，与 mdocs/sdm710/sdm710-freq-power.md §3 表逐档一致
# （生成器会断言档位数；写 scaling_max_freq 前须 floor 对齐到表内档位）。
freq_khz:
  # little / policy1：9 档 300000-1708800
  little:
    [
      300000,
      576000,
      748800,
      998400,
      1209600,
      1324800,
      1516800,
      1612800,
      1708800,
    ]
  # big / policy6：13 档 300000-2208000
  big:
    [
      300000,
      652800,
      825600,
      979200,
      1132800,
      1363200,
      1536000,
      1747200,
      1843200,
      1996800,
      2054400,
      2169600,
      2208000,
    ]

# [idle] / [dpc] 本机型无本地 dtsi，暂无该数据；缺段 = None → 调用方走原有回退路径。

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」。
# 未真机核实，取高通系通用表；performance 垫底防前面全部不可用。
cpu_governors: [uag, walt, schedutil, performance]

# >>> frontier_policy (generated) >>>
# 由 scripts/frontier_policy.py 生成；受控块替换，块外内容请勿手改本块
# 口径: 能效模型 mdocs/sdm710/sdm710-freq-power.md §3 簇级表 + 本文件 capacity/freq_khz
# 运行期: 只查表落点与逐档功耗（不重算 Cx·f·V²）；表缺失/指纹不符/桶越界 → 回退既有参数组
frontier_policy:
  enabled: true
  model_fingerprint: "aa81e6e033c7bd72"
  # 无独立公布值可对账（实测折算表，逐档见能效模型文档 §3）
  # 各簇**单核**能效曲线：相对能效模型（energy_model）的唯一数据源。
  # power_w = 簇功耗（溯源用）；single_core_power_w = 单核动态功耗（运行期消费）。
  # 运行期只取**形状**（归一成 0→1 相对向量），绝对瓦数不参与任何比较。
  per_cluster:
    little: { capacity: 473, freq_khz: [300000, 576000, 748800, 998400, 1209600, 1324800, 1516800, 1612800, 1708800], power_w: [0.5100, 0.6563, 0.7472, 0.8090, 0.9155, 0.9578, 1.0270, 1.0447, 1.1559], single_core_power_w: [0.0850, 0.1094, 0.1245, 0.1348, 0.1526, 0.1596, 0.1712, 0.1741, 0.1926] }
    big: { capacity: 1024, freq_khz: [300000, 652800, 825600, 979200, 1132800, 1363200, 1536000, 1747200, 1843200, 1996800, 2054400, 2169600, 2208000], power_w: [0.2398, 0.3346, 0.3920, 0.4554, 0.5247, 0.6455, 0.7536, 0.9074, 0.9469, 1.1108, 1.1796, 1.3403, 1.3684], single_core_power_w: [0.1199, 0.1673, 0.1960, 0.2277, 0.2624, 0.3227, 0.3768, 0.4537, 0.4734, 0.5554, 0.5898, 0.6702, 0.6842] }
