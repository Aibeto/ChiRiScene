    [
      300000,
      403200,
      480000,
      576000,
      652800,
      748800,
      825600,
      902400,
      979200,
      1056000,
      1132800,
      1228800,
      1324800,
      1420800,
      1516800,
      1612800,
      1689600,
      1766400,
    ]
  # big / policy4：24 档 825600-2803200
  big:
    [
      825600,
      902400,
      979200,
      1056000,
      1209600,
      1286400,
      1363200,
      1459200,
      1536000,
      1612800,
      1689600,
      1766400,
      1843200,
      1920000,
      1996800,
      2092800,
      2169600,
      2246400,
      2323200,
      2400000,
      2476800,
      2553600,
      2649600,
      2803200,
    ]

# [idle] / [dpc] 本机型无本地 dtsi，暂无该数据；缺段 = None → 调用方走原有回退路径。

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」。
# 未真机核实，取高通系通用表；performance 垫底防前面全部不可用。
cpu_governors: [uag, walt, schedutil, performance]

