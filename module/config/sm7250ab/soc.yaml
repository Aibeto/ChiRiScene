# sm7250ab/soc.yaml: [topology] [capacity] [freq_khz] [cpu_governors] [frontier_policy]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
# 本文件由 devimpbin/gen_soc_config.py 从 freqbench_tensor 实测批量生成；
# [frontier_policy] 是例外（策略表，由 scripts/frontier_policy.py 生成，块外勿手改）。
soc: "sm7250ab"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 数据源 = 该机型 results.json 的 cpufreq policy 首核（实测，不是周期表抄写）：
# little：cpus 0-5（6 核）
# big：cpus 6-6（1 核）
# prime：cpus 7-7（1 核）
topology:
  little: { start: 0, end: 6 }
  big: { start: 6, end: 7 }
  prime: { start: 7, end: 8 }

# [capacity] EAS capacity 兜底（真机 cpu_capacity 读不到时用；真机 sysfs 永远优先）。
# 取值 = 实测 coremarks_per_mhz(f_max) × f_max 归一到最高簇 1024；
# 与控制侧算力权重同口径（相对值），不是绝对分。真机 cpu_capacity 一旦可读即被覆盖。
capacity:
  little: 367
  big: 941
  prime: 1024

# [freq_khz] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# 来源 = freqbench 逐档实测，与 mdocs/sm7250ab/sm7250ab-freq-power.md §3 表逐档一致
# （生成器会断言档位数；写 scaling_max_freq 前须 floor 对齐到表内档位）。
freq_khz:
  # little / policy1：9 档 300000-1804800
  little:
    [
      300000,
      576000,
      614400,
      864000,
      1075200,
      1363200,
      1516800,
      1651200,
      1804800,
    ]
  # big / policy6：8 档 652800-2208000
  big:
    [
      652800,
      940800,
      1152000,
      1478400,
      1728000,
      1900800,
      2092800,
      2208000,
    ]
  # prime / policy7：8 档 806400-2400000
  prime:
    [
      806400,
      1094400,
      1401600,
      1766400,
      1996800,
      2188800,
      2304000,
      2400000,
    ]

# [idle] / [dpc] 本机型无本地 dtsi，暂无该数据；缺段 = None → 调用方走原有回退路径。

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」。
# 未真机核实，取高通系通用表；performance 垫底防前面全部不可用。
cpu_governors: [uag, walt, schedutil, performance]

# >>> frontier_policy (generated) >>>
# 由 scripts/frontier_policy.py 生成；受控块替换，块外内容请勿手改本块
# 口径: 能效模型 mdocs/sm7250ab/sm7250ab-freq-power.md §3 簇级表 + 本文件 capacity/freq_khz
# 运行期: 只查表落点与逐档功耗（不重算 Cx·f·V²）；表缺失/指纹不符/桶越界 → 回退既有参数组
frontier_policy:
  enabled: true
  model_fingerprint: "57d18a0ffccfedb5"
  # 无独立公布值可对账（实测折算表，逐档见能效模型文档 §3）
  # 各簇**单核**能效曲线：相对能效模型（energy_model）的唯一数据源。
  # power_w = 簇功耗（溯源用）；single_core_power_w = 单核动态功耗（运行期消费）。
  # 运行期只取**形状**（归一成 0→1 相对向量），绝对瓦数不参与任何比较。
  per_cluster:
    little: { capacity: 367, freq_khz: [300000, 576000, 614400, 864000, 1075200, 1363200, 1516800, 1651200, 1804800], power_w: [0.6950, 0.4983, 0.7399, 1.2938, 1.3868, 1.5943, 0.8690, 1.2629, 1.7868], single_core_power_w: [0.1158, 0.0830, 0.1233, 0.2156, 0.2311, 0.2657, 0.1448, 0.2105, 0.2978] }
    big: { capacity: 941, freq_khz: [652800, 940800, 1152000, 1478400, 1728000, 1900800, 2092800, 2208000], power_w: [0.1607, 0.2277, 0.3119, 0.3449, 0.4806, 0.6142, 0.7242, 0.7011], single_core_power_w: [0.1607, 0.2277, 0.3119, 0.3449, 0.4806, 0.6142, 0.7242, 0.7011] }
    prime: { capacity: 1024, freq_khz: [806400, 1094400, 1401600, 1766400, 1996800, 2188800, 2304000, 2400000], power_w: [0.2610, 0.3167, 0.4239, 0.4824, 0.6742, 0.7215, 0.8128, 0.8949], single_core_power_w: [0.2610, 0.3167, 0.4239, 0.4824, 0.6742, 0.7215, 0.8128, 0.8949] }
