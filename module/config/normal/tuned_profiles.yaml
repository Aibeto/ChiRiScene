# tuned_profiles.yaml: [default-profile] [tuned-profiles]
# 特调参数组：缺省参数段（akmode）+ 按模式名分派的参数组（tuned_profiles）
# 编译期嵌入二进制（module/config 目录整体 include_dir!），磁盘副本不加载。
# 字段说明见 mdocs/tuned_profiles-example.yaml（example 文件不随构建嵌入）；未写字段取代码默认值。
#
# 无档位连续控制：每个负载 tick（40ms）按核心组实时负载直接计算
# scaling_max_freq 目标上限，升频立即执行、降频 hysteresis + down_hold_ms
# 防抖。替代原四档方案（少数线程高占用负载下 max 单边下探）。
# [default-profile]
# 缺省参数（akmode 游戏特调；未在 tuned_profiles 中注册的模式都回退到这段）
akmode:
  headroom: 1.15
  perf_floor: 0.0
  # 2026-09-22 8475（原注释误写 8745）明日方舟实测调整（全局生效，游戏场景各 SoC 同向受益）：
  # 该场景 7.06 W、big 上限中位数 100%、gpu 74%——原本 headroom 1.15 且无天花板，
  # util 尖峰一来就是 1.0×1.15 → clamp 1.0 直接满频。
  # util_smoothing 0.85：只滤最陡的尖峰（游戏仍以响应优先，不做到 0.3 那种强平滑）。
  # 原 perf_ceil 0.95 属天花板，2026-09-28 拆除：省电改走升频审批 + 稳态下探。
  perf_ceil: 1.0
  hysteresis: 0.03
  down_hold_ms: 100
  util_smoothing: 0.85

# [tuned-profiles]
# 按特调模式名分派的参数组（模式名在 special_tuned.yaml 的模式列表中注册，
# 与这里的键同名即自动生效；未注册的模式回退上面的 akmode 段）。
# 机制与 akmode 完全共用，差异只在参数倾向：
tuned_profiles:
  # playback —— 视频播放稳态（2026-09-17 8550 实测新增）：只有长稳态场景
  # 值得特调（上机反馈：高频短交互不该被接管，daily 组已于当晚移除）。
  # boost_affinity=false：不做 boost 亲和收窄、不保大核常在线——保大核与
  # 「贴负载省电」相反，播放场景让核按 EAS 自然摆放。
  #
  # 2026-09-20 8550 视频功耗回放调整（依据见 .archive/.codebuddy/docs/2026-09-20-8550-video-power-analysis.md）：
  # - headroom 1.05 → 0.95：原「别压太紧」档位下 little 上限仍达 72%（p95 100%），
  #   而 capfreq_little 与 batt_p 相关性最强（r=0.884），是头号功耗驱动；
  # - util_smoothing 0.35 → 0.25：进一步滤掉弹幕/进度条尖峰，压 prime 的 p95（84%）；
  # - per_cluster：三簇形态不同，模式级一刀切必然顾此失彼——
  #     little 过载（各核 util 54~59%、p95 近 100%）→ 再收一档并压天花板 0.65；
  #     prime 空转（util p50=0）却被尖峰顶到 84% → 收 headroom + 天花板 0.50；
  #     big（util 30~39%）不覆盖，跟随模式级 0.95；
  # - migration_cost_ns 400000：稳态下调高迁移成本，减少无谓跨核搬迁（实测 ≈557 次/s），
  #   接管期生效、退出按快照恢复（feature.yaml 的一次性 200000 不受影响）。
  # 2026-09-28：headroom（模式级 0.85 / per_cluster）与三簇 perf_ceil 全部拆除（R2 天花板），
  #   稳态降功耗改由 steady_decay_* 承担；未列 per_cluster 的簇与字段一律回退模式级值。
  playback:
    # target = util × headroom。原 0.85 是天花板（util 满也只能到 0.85×硬件上限），
    # 2026-09-28 拆除 → 1.0（贴负载，尖峰不再被 0.85 按住）。
    headroom: 1.0
    perf_floor: 0.0
    perf_ceil: 1.0
    # 死区 = hw_max × hysteresis，须 ≥ 频表相邻档步长，否则上限会在相邻两档间往复；
    # down_hold_ms 是降档保持时间。
    # TODO: 实机复核 0.06 / 150（看 big 改频次数与 P_avg，fps 无损才保留）。
    hysteresis: 0.06
    down_hold_ms: 150
    util_smoothing: 0.25
    boost_affinity: false
    # per_cluster 三簇天花板（little 0.90/0.55、big 0.75、prime 0.80/0.50）2026-09-28 整段拆除；
    # 未列簇/字段本就回退模式级值，删段与「不覆盖」等价。
    migration_cost_ns: 400000

  # sweet —— 甜点封顶（2026-10-23 8550 日志分析新增，logd_1023-011754；入口 com.baiyang.eet）
  # 与 playback 的分工：playback 是「贴负载软跟随」（util×headroom，util 高就放），
  # sweet 是「按能效曲线硬封顶」——EEM 相对能效模型的甜点档就是「最后一档 1 单位功耗
  # 还能换到 ≥1 单位算力」的位置，再往上加热大于加算力。实测依据（同一份日志）：
  #   cap 越甜点比例  little 4% / big 34% / prime 67%（prime p50 2477MHz = 甜点 1709 的 1.45 倍）
  #   而该包 gpu 仅 2.1%、wakeups 3.8k/s、migrations 1.7k/s —— 负载不重，上限被单核尖峰推高
  # 故 headroom 收到 1.0（不外推）、util_smoothing 0.5（滤掉单核瞬时尖峰，避免反复顶上限）、
  # down_hold_ms 收到 100（甜点内下探要跟得上，别卡在越甜点的旧上限）。
  # boost_affinity=false：同 playback——保大核常在线与「按能效压上限」相反。
  # sweet_cap: auto 由 soc.yaml 的 frontier_policy 曲线取甜点，跨机型通用；
  # 无曲线的机型本组不封顶（安全侧：只是不省电，不削性能），需要时改 ratio + sweet_cap_ratio。
  # sweet_cap_release_units: 簇内**平均**占用率达 0.85 才允许越过甜点。
  # 用平均而非核当量：prime 只有 1 核，核当量阈值退化成恒真（占用恒 ≤1.0）＝永不封顶；
  # 平均占用率对任意簇规模同口径（0.85 = 整簇平均 85% 满），实测该包 prime 平均占用
  # 远低于此（max_util p50 0.98 但那是「组内最大值」不是平均），故稳态保持在封顶内。
  # hold_ticks 6 ≈ 240ms 放行窗口，避免占用在阈值附近抖动导致上限来回跳。
  sweet:
    headroom: 1.0
    perf_floor: 0.0
    perf_ceil: 1.0
    hysteresis: 0.04
    down_hold_ms: 100
    util_smoothing: 0.5
    boost_affinity: false
    sweet_cap: auto
    # auto 下不参与；留作 ratio 模式的机型兜底值（≈ sm8550 三簇甜点 0.50~0.54 的上沿）
    sweet_cap_ratio: 0.55
    sweet_cap_release_units: 0.85
    sweet_cap_release_hold_ticks: 6
    # 甜点封顶期间上限变化频繁（快落快起），不额外调迁移成本：本模式不追求少搬迁
    # 而是「别在越甜点的档位上待着」，搬迁成本抬高会让 EAS 更保守地留在高上限核上
