# dfm.yaml: [fas-rules]
# FAS 配置：com.tencent.tmgp.dfm（三角洲行动）
# UE4 战术射击：对局帧率稳定优先，开镜/交火为瞬时负载尖峰，场景加载重。
# 模板取 sgame（同为腾讯竞技类）。
# 注意：fps_gears 必须覆盖游戏内实际可选档位——表里多出的档会被 PID 顶着跑、
# 少了档会被误判降档；若游戏内无 90 帧档，把 90 从 fps_gears 与 target_fps 两处删掉。
fas_rules:
  fps_gears: [30.0, 60.0, 90.0, 120.0]
  fps_margin: 3.0
  per_app_profiles:
    com.tencent.tmgp.dfm:
      target_fps: [60, 90, 120]
      fps_margin: 3.0
  # 接管/切回后的起始性能 0.50（与 sgame/speedmobile 一致）
  perf_init: 0.50
  migration_cost_ns: 400000
  core_temp_threshold: 45.0
