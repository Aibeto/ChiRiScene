# sdm712/soc.yaml: [topology] [capacity] [freq_khz] [cpu_governors] [frontier_policy]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
# 本文件由 devimpbin/gen_soc_config.py 从 freqbench_tensor 实测批量生成；
# [frontier_policy] 是例外（策略表，由 scripts/frontier_policy.py 生成，块外勿手改）。
soc: "sdm712"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 数据源 = 该机型 results.json 的 cpufreq policy 首核（实测，不是周期表抄写）：
# little：cpus 0-5（6 核）
# big：cpus 6-7（2 核）
# prime：本机型无该簇（空区间）
topology:
  little: { start: 0, end: 6 }
  big: { start: 6, end: 8 }
  prime: { start: 0, end: 0 }   # start == end：本机型无该簇

# [capacity] EAS capacity 兜底（真机 cpu_capacity 读不到时用；真机 sysfs 永远优先）。
# 取值 = 实测 coremarks_per_mhz(f_max) × f_max 归一到最高簇 1024；
# 与控制侧算力权重同口径（相对值），不是绝对分。真机 cpu_capacity 一旦可读即被覆盖。
capacity:
  little: 453
  big: 1024

# [freq_khz] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# 来源 = freqbench 逐档实测，与 mdocs/sdm712/sdm712-freq-power.md §3 表逐档一致
# （生成器会断言档位数；写 scaling_max_freq 前须 floor 对齐到表内档位）。
freq_khz:
  # little / policy1：9 档 300000-1708800
  little:
    [
      300000,
      576000,
      748800,
      998400,
      1209600,
      1324800,
      1516800,
      1612800,
      1708800,
    ]
  # big / policy6：14 档 300000-2304000
  big:
    [
      300000,
      652800,
      825600,
      979200,
      1132800,
      1363200,
      1536000,
      1747200,
      1843200,
      1996800,
      2054400,
      2169600,
      2208000,
      2304000,
    ]

# [idle] / [dpc] 本机型无本地 dtsi，暂无该数据；缺段 = None → 调用方走原有回退路径。

# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」。
# 未真机核实，取高通系通用表；performance 垫底防前面全部不可用。
cpu_governors: [uag, walt, schedutil, performance]

# >>> frontier_policy (generated) >>>
# 由 scripts/frontier_policy.py 生成；受控块替换，块外内容请勿手改本块
# 口径: 能效模型 mdocs/sdm712/sdm712-freq-power.md §3 簇级表 + 本文件 capacity/freq_khz
# 运行期: 只查表落点与逐档功耗（不重算 Cx·f·V²）；表缺失/指纹不符/桶越界 → 回退既有参数组
frontier_policy:
  enabled: true
  model_fingerprint: "0aef4917ece708eb"
  # 无独立公布值可对账（实测折算表，逐档见能效模型文档 §3）
  # 各簇**单核**能效曲线：相对能效模型（energy_model）的唯一数据源。
  # power_w = 簇功耗（溯源用）；single_core_power_w = 单核动态功耗（运行期消费）。
  # 运行期只取**形状**（归一成 0→1 相对向量），绝对瓦数不参与任何比较。
  per_cluster:
    little: { capacity: 453, freq_khz: [300000, 576000, 748800, 998400, 1209600, 1324800, 1516800, 1612800, 1708800], power_w: [0.3871, 0.5836, 0.6022, 0.7581, 0.7721, 0.8973, 0.8745, 0.9492, 1.0784], single_core_power_w: [0.0645, 0.0973, 0.1004, 0.1263, 0.1287, 0.1495, 0.1458, 0.1582, 0.1797] }
    big: { capacity: 1024, freq_khz: [300000, 652800, 825600, 979200, 1132800, 1363200, 1536000, 1747200, 1843200, 1996800, 2054400, 2169600, 2208000, 2304000], power_w: [0.1774, 0.2635, 0.3640, 0.3843, 0.4488, 0.5581, 0.6621, 0.8181, 0.8208, 0.9704, 1.0453, 1.2488, 1.2070, 1.4117], single_core_power_w: [0.0887, 0.1318, 0.1820, 0.1921, 0.2244, 0.2791, 0.3311, 0.4091, 0.4104, 0.4852, 0.5226, 0.6244, 0.6035, 0.7058] }
