# ChiRi 兜底调优配置（未命中 {soc}/ 处理器目录的机型使用；8550 等走各自 SoC 文件）
# feature.yaml: [function] [io-settings] [cpu-idle] [reduce] [default] [boost] [vector]（meta 在 meta.yaml）

# [function]
# 主要功能开关
function:
  CpuIdleScalingGovernor: false
  IOOptimization: true

# [io-settings]
# IO 设置
IO_Settings:
  Scheduler: "none"
  read_ahead_kb: "128"
  nomerges: "2"
  iostats: "0"

# [cpu-idle]
# CPU 空闲设置
CpuIdle:
  current_governor: ""

# [reduce]
# 省电模式（CLG 家族）：较 default 升频更保守（up 0.85>0.80）、降频更激进
# （down 0.60>0.50、rate_limit 2）。省电只走门槛 + 升频速率 + 稳态下探，
# 不砍上限：持续满负载仍要能写到硬件最高频（除 SceneMode）。
reduce:
  cpu_load_governor:
    up_threshold: 0.85
    down_threshold: 0.60
    smoothing_up: 0.40
    util_smoothing: 0.5
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 2
    headroom_factor: 1.10
    headroom_ramp: 0.15
    perf_floor: 0.10
    perf_ceil: 1.0
    perf_init: 0.30
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    down_fast_threshold: 0.10
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [default]
# 均衡模式（CLG 家族）：默认档兼参考基线
default:
  cpu_load_governor:
    up_threshold: 0.80
    down_threshold: 0.50
    smoothing_up: 0.60
    # 决策负载 EMA（1.0=关闭）：滤掉抖动负载的单 tick 摆动，抑制决策方向反复翻转
    # 与 scaling_max_freq 高频改写（2026-09-22 8550 QQ 日志回放：反转降约五成）。
    # 性能档 boost 保持 1.0 不开（响应优先）。
    util_smoothing: 0.5
    down_rate_limit_ticks: 3
    up_rate_limit_ticks: 2
    headroom_factor: 1.25
    headroom_ramp: 0.15
    perf_floor: 0.15
    # 不设上限：省电靠门槛 + 升频速率 + 稳态下探（steady_decay_*），不靠砍 perf_ceil——
    # 砍了就等于持续满负载也到不了硬件最高频。2026-09-22 曾压到 0.80（视频场景省 26.5%），
    # 2026-09-28 按「天花板一律拆除」撤回，稳态降功耗改由下探承担、交互响应仍由
    # touch_boost 兜（下探会在负载回升时立即停止并回到正常升频路径）。
    perf_ceil: 1.0
    perf_init: 0.50
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    down_fast_threshold: 0.10
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [boost]
# 性能模式（CLG 家族）：较 default 升频更激进（up 0.65<0.80）、降频略消极
# （down 0.40<0.50、rate_limit 5），headroom 1.40 给线程/核心更大余量
boost:
  cpu_load_governor:
    up_threshold: 0.65
    down_threshold: 0.40
    smoothing_up: 0.80
    down_rate_limit_ticks: 5
    up_rate_limit_ticks: 1
    headroom_factor: 1.40
    headroom_ramp: 0.15
    perf_floor: 0.35
    perf_ceil: 1.0
    # 稳态下探关闭：与 8550 boost 同口径——boost 是对功耗宽松档。本档 up_threshold 0.65 时
    # T = (1.0/1.40)×0.90 ≈ 0.64，开启下探会让常态负载（0.10~0.64）持续被削，损失响应优势
    steady_decay_enabled: false
    perf_init: 0.60
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    down_fast_threshold: 0.10
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [vector]
# 极速模式（rhine 家族，仅实验室）：全核最高频——运行时走 fast_lock 硬锁
# （min=max=hw_max、governor 保持 schedutil），不读本段参数；本段仅为缺省值来源
vector:
  cpu_load_governor:
    up_threshold: 0.01
    down_threshold: 0.01
    smoothing_up: 1.0
    down_rate_limit_ticks: 10
    up_rate_limit_ticks: 1
    headroom_factor: 2.0
    headroom_ramp: 0.15
    perf_floor: 1.0
    perf_ceil: 1.0
    perf_init: 1.0
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    down_fast_threshold: 0.10
    spike_jump_threshold: 0.35
    spike_decay: 0.30

# [powerbase]
# PowerBase（Stardust 家族）：以**功耗**为指标的调频器。开关在 meta.yaml
# （`powerbase_enabled`，高级设置，默认关闭）；开启后接管原本由 CLG 接管的场合
# （reduce/default/boost），FAS / 特调 / DOWN 停摆 / 实验室的启停判据一律不受影响。
#   target_power_w      放电状态下的目标功耗（W）——各 SoC 在自己的 feature.yaml 覆盖
#   up_headroom_below   功耗**低于**目标时的升频宽松度（>1 = 放宽）
#   down_scale          降频激进度：目标性能乘以它（越小降得越狠；与功耗无关，恒生效）
#   overload_cores_pct  功耗已达上限时仍允许升频的门槛：满占用（100%）核心占比 %
#   overload_hold_ms    且需持续这么久才放行升频
#   touch_break_ms      触摸事件时允许短暂突破功率上限的窗口（档位体系启用时同时是触摸升档窗口）
#   tier_standard       频率上限档 / 触摸升档档位 / 绝对上限档（能效前沿表 demand_buckets 桶号）。
#   tier_touch          标准 → 触摸一级 → 触摸二级：触摸事件沿阶梯逐级放开、已在最高档则忽略本次
#   tier_max            调频，窗口过期回落标准档；任一为 0 / 非 PF SoC / 桶越界 → 不启用档位体系
powerbase:
  target_power_w: 3.0
  up_headroom_below: 1.15
  down_scale: 0.5
  overload_cores_pct: 50
  overload_hold_ms: 3000
  touch_break_ms: 400
  tier_standard: 0
  tier_touch: 0
  tier_max: 0
