# build.yml: [triggers] [env] [build-job]
name: Build ChiRi

# 触发条件：当推送到 main 分支，或者发布 tag 时触发。
# workflow_dispatch 允许在 GitHub 网页端手动点击运行。
# paths-ignore：以下目录不参与构建产物，纯文档/元信息提交不再触发整套交叉编译；
# tag 发布不受影响（path 过滤只比对分支提交的文件差异），必要时仍可 workflow_dispatch 手跑。
on:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "agentsdocs/**"
      - "mdocs/**"
      - ".archive/**"
      - ".trae/**"
      - ".cursor/**"
      - ".codebuddy/**"
      - ".workbuddy/**"
      - "scripts/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "agentsdocs/**"
      - "mdocs/**"
      - ".archive/**"
      - ".trae/**"
      - ".cursor/**"
      - ".codebuddy/**"
      - ".workbuddy/**"
      - "scripts/**"
  workflow_dispatch:
# 跳过机制：同一 ref（分支/PR）上有新运行进入时，取消仍在跑的旧运行，
# 避免连续 push 造成的排队与重复构建。tag 构建（发布产物）不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Package
    # 钉版本：ubuntu-latest 在 2026-10-19~11-19 期间切到 26.04，
    # TODO: 待 26.04 上验证过 eBPF 编译链（bpf-linker 预编译二进制 + NDK 链接）再升。
    # runs-on: ubuntu-24.04
    runs-on: ubuntu-26.04

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 0. 防呆：cache/ 与 output/ 为构建产物，若误入版本库则直接失败
      - name: Guard against tracked cache/output
        run: |
          if git ls-files | grep -E '^(cache/|output/)'; then
            echo "cache/ or output/ files must not be tracked" >&2
            exit 1
          fi

      # 2. 配置 Node.js 环境 (用于编译 WebUI)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24" # 推荐使用 LTS 版本
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # 3. 安装 WebUI 依赖
      # 用 npm ci：lock 与 package.json 已一致（2026-10-15 补齐缺失的
      # @rolldown/binding-darwin-x64 optional 条目后 npm ci 通过），
      # 严格锁版本 + 更快 + 能暴露 lock 漂移；setup-node cache 沿用。
      - name: Install WebUI dependencies
        working-directory: ./webui
        run: npm ci

      # 4. 配置 Rust Nightly 环境并添加 Android 交叉编译目标
      #    clippy/rustfmt 供下方 lint 步骤使用（lint 已并入本 job：代码含 bionic-only
      #    符号（libc::__system_property_get）且依赖 zstd-sys 需 NDK 的 android clang，
      #    独立 host lint job 无法编译，复用本 job 环境最省）
      #    工具链钉版本（2026-10-18 用户定）：浮动 nightly 会让 rustfmt/clippy 规则随
      #    构建漂移、本地与 CI 对不上。升级 = 改 toolchain 日期 → 本机用同版本跑
      #    fmt + check + clippy → 再提交（当前 1.101.0-nightly，commit 080cc2714）。
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-12
          targets: aarch64-linux-android
          components: rust-src, clippy, rustfmt # build-std 需要 rust-src (含 bpfel-unknown-none)

      # 5. 缓存 Rust 依赖与编译产物（含 -Z build-std 的 core 与 eBPF 产物）。
      #    纯加速步骤，不改构建语义：key 含 rustc 版本与 Cargo.lock，
      #    换工具链 pin 或依赖变更时自动冷启一次。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # 5.5. lint 前置：fmt 在所有重下载/编译之前先失败（秒级暴露格式漂移）
      - name: Lint (fmt)
        run: cargo fmt --all --check

      # 6. 安装 bpf-linker（官方预编译二进制，静态链接 LLVM，无系统依赖）。
      #    背景：bpf-linker 0.11 依赖 LLVM 21+，源码编译需要系统 LLVM 21+
      #    （ubuntu runner 无可用包）；cargo-binstall 因 asset 平台匹配问题回退到
      #    cargo install 而失败。因此直接经 GitHub API 解析官方 release asset 下载。
      #    build.rs 检测到 PATH 中已有 bpf-linker 后会跳过其内置安装逻辑。
      - name: Cache bpf-linker
        id: cache-bpf-linker
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/bpf-linker
          key: ${{ runner.os }}-${{ runner.arch }}-bpf-linker-v0.11.0

      - name: Install bpf-linker (prebuilt)
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          # 带 GITHUB_TOKEN 调 API：未鉴权时 runner 共享 IP 会被 rate limit，
          # 响应体没有 assets 字段（表现为 KeyError: 'assets'）；curl -f 让 4xx/5xx 直接失败
          # 并把响应体打出来，避免真实错误被 python 的 KeyError 掩盖。
          ASSET=$(curl -sSfL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aya-rs/bpf-linker/releases/tags/v0.11.0" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);a=d.get('assets') or sys.exit('release JSON 无 assets 字段: %r' % d);print(next(x['browser_download_url'] for x in a if 'x86_64-unknown-linux' in x['name'] and 'debuginfo' not in x['name']))")
          echo "Downloading $ASSET"
          curl -L -o /tmp/bpf-linker.tar.zst "$ASSET"
          mkdir -p /tmp/bpf-linker
          tar --use-compress-program=zstd -xf /tmp/bpf-linker.tar.zst -C /tmp/bpf-linker
          sudo find /tmp/bpf-linker -type f -name bpf-linker -exec install -m 755 {} /usr/local/bin/bpf-linker \;
          bpf-linker --version

      # 7. 安装 Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      # 8. 导出 NDK 路径给后续步骤（cargo-ndk 依据 ANDROID_NDK_HOME 定位 NDK）
      - name: Setup NDK environment
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # 9. 安装 cargo-ndk（官方预编译二进制，替代 `cargo install` 的源码编译）。
      #    与 bpf-linker 同理：带 GITHUB_TOKEN 调 API 解析 release asset，
      #    避免未鉴权时 runner 共享 IP 被 rate limit（响应体无 assets 字段）。
      #    注意该二进制只认 `cargo ndk` 调用方式，不能直接执行做 --version。
      - name: Cache cargo-ndk
        id: cache-cargo-ndk
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/cargo-ndk
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ndk-v4.1.2

      - name: Install cargo-ndk (prebuilt)
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: |
          ASSET=$(curl -sSfL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/bbqsrc/cargo-ndk/releases/tags/v4.1.2" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);a=d.get('assets') or sys.exit('release JSON 无 assets 字段: %r' % d);print(next(x['browser_download_url'] for x in a if x['name'].startswith('cargo-ndk-x86_64-unknown-linux-gnu-')))")
          echo "Downloading $ASSET"
          curl -L -o /tmp/cargo-ndk.tar.gz "$ASSET"
          mkdir -p /tmp/cargo-ndk
          tar -xzf /tmp/cargo-ndk.tar.gz -C /tmp/cargo-ndk
          sudo find /tmp/cargo-ndk -type f -name cargo-ndk -exec install -m 755 {} /usr/local/bin/cargo-ndk \;
          cargo ndk --version

      # 9.5. lint 后置：NDK 就绪后按 android target 跑 check/clippy。
      #    zstd-sys 是全仓唯一 cc 编译依赖，裸 cargo check 找不到 NDK 裸名 clang
      #    （r29 的 bin 只有 API 后缀版 aarch64-linux-android26-clang），须照
      #    cargo-ndk build_env 注入 CC/AR/CFLAGS（NDK r28+ 16KB 页无需 LDFLAGS）。
      #    在完整构建前暴露类型/借用/clippy 错误；存量 clippy 警告暂不强制失败。
      - name: Lint (check + clippy)
        run: |
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/clang" \
                 CXX_aarch64_linux_android="$NDK_BIN/clang++" \
                 AR_aarch64_linux_android="$NDK_BIN/llvm-ar" \
                 RANLIB_aarch64_linux_android="$NDK_BIN/llvm-ranlib" \
                 CFLAGS_aarch64_linux_android="--target=aarch64-linux-android26"
          cargo check --workspace --all-targets --target aarch64-linux-android
          cargo clippy --workspace --all-targets --target aarch64-linux-android --no-deps
        env: { YUMI_SKIP_EBPF: "1" }

      # 10. 模块文本文件的注释剥离已下沉到 xtask（见 xtask::strip_comments）：
      #    它作用在 xtask 自己创建的 output/.temp 产物副本上，module/ 全程只读——
      #    构建任一阶段失败/被杀都不会不可逆地删掉工作区注释（旧实现此处直接
      #    `perl -i` 改仓库 module/，属原地破坏；已移除）。
      #    语义不变：删整行 #，保留 shebang 与行内 #，跳过 META-INF/ 与 scripts/。

      # 11. 运行 xtask 构建（仅组装目录，不预打包 zip；GitHub 下载产物时会自动压缩）
      #     CHIRI_RUSTUP_TOOLCHAIN 必须与 Setup Rust Toolchain 的 toolchain 同步：
      #     xtask 的 `cargo +<spec>` 走 rustup 解析，缺失该 spec 会自动装最新 nightly。
      - name: Run xtask build
        run: cargo xtask build --no-pack
        env:
          CHIRI_RUSTUP_TOOLCHAIN: nightly-2026-10-12

      # 12. 动态获取 xtask 生成的模块目录（按 module.prop 命名）
      - name: Resolve Artifact Directory
        id: artifact
        run: |
          # 找到 output 下生成的模块目录（no-pack 模式下仅一个，.temp 已重命名）
          DIR_PATH=$(ls -d output/*/ | head -n 1 | sed 's/\/$//')
          DIR_NAME=$(basename "$DIR_PATH")

          # 目录名即 artifact 名（GitHub 下载时自动生成同名的 <name>.zip）
          echo "name=$DIR_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$DIR_PATH" >> "$GITHUB_OUTPUT"

      # 13. 上传整个模块目录（不做预打包，交由 GitHub 统一压缩成 <name>.zip）
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          # 使用上一步获取的动态名称
          name: ${{ steps.artifact.outputs.name }}
          # 精确指定要上传的那一个目录
          path: ${{ steps.artifact.outputs.path }}
