# config-example.yaml: [meta] [function] [io-settings] [cpu-idle] [scene-delay] [affinity] [corectl] [thermal] [modes]
# 完整字段说明书：原 config.yaml 已拆分为 meta.yaml（可修改抬头，daemon 严格校验）
# 与 feature.yaml（不可修改调优段，仅存于二进制不落盘）。本文件不参与加载，
# 纯粹当字段说明书用；改 meta/feature 模板源文件后重新编译才生效。
#
# 注意：调优配置编译期嵌入二进制（module/config 目录整体 include_dir!），磁盘文件只是
# "嵌入内容 + meta 覆盖"的快照。daemon 启动/重载时会把嵌入内容
# 写回磁盘，篡改会被还原。meta 段允许外部修改：WebUI 开关落点六项
# （language / loglevel / dev_record / fas_enabled / scenemode_enabled / thread_bind）；
# 另有手改字段 devimp_top_n / nofix / power_max_w / 电池校准项
# （voltage_divisor / current_divisor / unit_divisor）等——全集以 src/common.rs
# 的 ExternalMetaOverrides 实际字段为准。
# 改调优参数要改这份模板源文件再重新编译。

# [meta]
# 允许外部修改：WebUI 开关落点六项（language / loglevel / dev_record / fas_enabled /
# scenemode_enabled / thread_bind，热重载生效）；另有手改字段（WebUI 无开关）：
# devimp_top_n / nofix / power_max_w / 电池校准项（voltage_divisor / current_divisor /
# unit_divisor）等，全集以 src/common.rs 的 ExternalMetaOverrides 为准
# name/author 固定，外部修改无效且被快照自愈还原
meta:
  name: "example_config" # 仅供文档参考，代码不解析
  author: "ChiRi" # 仅供文档参考
  language: "zh" # en / zh；WebUI 语言开关（守护进程热重载生效）
  loglevel: "INFO" # DEBUG / INFO / WARN / ERROR
  # 开发记录开关：true 时守护进程向 devimp/ 写**双诊断文件**：
  #   main_<前台包名>_<MMDD-HHmmss>.log —— 主诊断（tick/snap/event 行），前台包名
  #     切换自动换新文件；
  #   aff_<MMDD-HHmmss>.log —— 线程流（@A 动作帧 + @S 每秒进程/线程快照帧）。
  # 时间戳为本地时间 MMDD-HHmmss 秒级（同秒重开补 -N 去重）；单文件软上限 128MB，
  # 触顶换新文件继续写。用于离线分析改善调度。
  # @S 快照的 top-N 进程数由 meta 段 devimp_top_n 控制（缺省 10，clamp 到 1..=64，
  # 0 不合法会被 clamp）：每秒按 util 降序落盘前 N 个进程，前台树与被管进程
  # 不受 N 截断、恒定落盘。
  # 布尔值必须裸写（serde_yaml 把带引号的
  # "true" 解析为字符串而非 bool）。允许外部修改（WebUI 开关 + 热重载）
  dev_record: false
  # ── 功能总开关（缺省 true，允许外部修改：手改后热重载即时生效；布尔值必须裸写）──
  # fas_enabled：FAS 帧感知调度总闸。false 后 fas_available() 恒为 false——
  #   determine_mode 不再产生 fas 模式、FAS 监测线程不启动、运行中 FAS 实例立即
  #   注销并按屏幕状态恢复 default/doze 接管。
  fas_enabled: true
  # scenemode_enabled：息屏场景模式总闸。false 后息屏不再进入 scenemode；
  # 已激活的下个负载 tick 自动退出并恢复 affinity/core_ctl 快照 + doze 配置。
  scenemode_enabled: true

# [function]
function:
  # cpuidle governor 切换：true 时把 CpuIdle.current_governor 写入 sysfs
  CpuIdleScalingGovernor: false
  # IO 优化：true 时写入 I/O 调度器、预读、合并策略
  IOOptimization: true

# [io-settings]
IO_Settings:
  # I/O 调度器（写入 /sys/block/*/queue/scheduler）
  # "none"（NVMe/UFS 默认）、"mq-deadline"、"cfq"，空串不切换
  Scheduler: "none"
  # 预读大小 kB（写入 /sys/block/*/queue/read_ahead_kb）
  read_ahead_kb: "128"
  # 请求合并：0=不禁用（系统默认）、1=禁止简单合并、2=完全禁止
  nomerges: "2"
  # IO 统计：0=关（省开销）、1=开（调试时用）
  iostats: "0"

# [cpu-idle]
CpuIdle:
  # 写入 /sys/devices/system/cpu/cpuidle/current_governor
  # "menu"（交互设备默认，按预期空闲时长选最深 C 状态）、"ladder"、"teo"
  # 空串不切换，且 CpuIdleScalingGovernor 须为 true 才生效
  current_governor: ""

# [scene-delay]
# 息屏省电（已暂停）
# [已暂停] 息屏节电（doze + scenemode）触发点在调度器内注释（src/chiri/mod.rs
# 搜 "PAUSED"），屏幕状态不再驱动调度；字段保留供日后恢复。
# 恢复后语义：屏幕熄灭超过该秒数后切到 scenemode 低功耗配置，亮屏恢复原模式。
# 默认 300（5 分钟）。
scene_mode_delay_secs: 300

# [affinity]
# CPU 亲和与线程迁移（ChiRi 专属）
# boost 类模式（boost/vector/特调/fas）下收窄 top-app/foreground cpuset
# 到大核+超大核、后台分组压小核；线程层按核心粒度做 sched_setaffinity
# 单核放置（前台关键线程→prime、普通→big；后台繁忙线程动态 promote，
# 空闲 demote；选核排除离线核）。
# [已暂停] 息屏不再切换 normal/doze 布局（屏幕状态不驱动调度），亲和按亮屏
# 口径常态生效；布局切换代码保留（affinity::apply 的 screen_on 参数）。
# 黑名单在 src/chiri/affinity_blacklist.yaml（编译嵌入，不外透）。
Affinity:
  # 总开关：false 时全量恢复系统布局，不做任何写入
  enabled: true
  # boost 下 top-app 的 cpu.uclamp.min 百分比（0=不启用；uclamp.min 会让
  # schedutil 独立于 CLG 抬频，与动态上限语义打架，默认关闭）
  top_app_uclamp_min_pct: 0
  # boost 下 top-app 的 cpu.uclamp.max 百分比（任务级性能上限，EAS 原生感知；
  # 内核 >= 5.3 生效，节点缺失/写入回读无效会自动纠正关闭）。
  # 按机型：8550/8475 配 85，8998（内核 4.4）配 0 关闭
  top_app_uclamp_max_pct: 85
  # 线程层总开关：前台线程按核钉定 + 后台动态 promote/demote（仅亮屏）
  pin_foreground_threads: true
  # 后台降权（background / restricted 的 cpu.uclamp.max 百分比，0=关闭）：把后台任务
  # 的 util 需求钳低，EAS 放置与 schedutil 频率随之回落；**不禁止使用大核**。
  # 刻意不含 system-background（媒体/音频等可感知的系统后台）。
  background_uclamp_max_pct: 50
  # normal（非 boost）下 top-app/foreground 组掩码剔除 little 的预置开关（默认关闭）
  normal_fg_exclude_little: false

  # ---- 放置与亲和线（2026-09-28 新增；全部可选，不写 = 代码缺省 = 原行为逐位一致）----
  # 后台/批处理线程 promote 时禁止溢出到 prime（prime 冲顶段边际能效最差）
  bg_promote_exclude_prime: true
  # big 饱和保护推广到所有会 promote 的模式（false = 回到「仅 boost 态」旧行为）
  big_pressure_any_mode: true
  # AArch32 簇白名单：**留空 = 不限制落点 = 不做 32/64 区分**（主流系统带转译层，32 位程序
  # 实际可跑全核；留空时位宽判定仍生效，但只用于落 `elf32` 观测帧、不拦截任何落点）。
  # 只有确认系统无转译层时才填 ["little"] 之类，届时才在写掩码前拦截「32 位 → 无 AArch32 的簇」
  aarch32_clusters: []
  # 位宽感知总开关（false = 连 32 位判定与 elf32 观测帧都关掉）
  bitwidth_aware: true
  # 掩码写去重 + 同 tid 同目标最短重写间隔（false = 逐位回旧行为）。
  # 注意去重只在「本层再次决定写同一目标」时生效，内核侧被框架/外部改写的掩码不会周期性纠偏
  write_dedup: true
  # ---- FDP：帕累托前沿主导的放置内核（默认关闭；只有已适配前沿表的机型才有数据）----
  # 用逐档簇功耗（由 scripts/frontier_policy.py 从 mdocs/8550/sm8550-freq-power.md §3 生成进
  # soc.yaml 的 frontier_policy 段）做**双边净收益**比较：只有
  #   [源簇让出后 − 现状] + [目标簇承接后 − 现状] < 0（且超阈值）
  # 才迁移——等价于「等算力下把算力放到边际 mW/Mdmips 更低的地方」。
  # 现状取实测（最忙核 util + scaling_cur_freq），之后按单核落位 + schedutil util→freq 映射估。
  # 只作用于**后台/批处理线程 promote**（成本模型不含延迟项，前台路径不动）。
  # ⚠️ 表是纯动态项、不含漏电与 idle-exit，只做相对排序；无 frontier_policy 段的机型整段不动作。
  fdp_enabled: false
  # 只在该次搬迁能省 ≥ 该值(W) 时才动（防噪声上的反复搬）
  fdp_cost_hysteresis_w: 0.02
  # 每轮每个目的簇的迁入条数硬上限（0 视为 1）
  fdp_max_inserts_per_round: 2
  # 迁入后目标簇模型工作频率不得高于该值 × 该簇最高频（0.3..1.0）
  fdp_dst_freq_cap_ratio: 0.85
  # 放置类阈值可配化：缺省值 = src/chiri/affinity.rs consts 段的原常量（唯一数字源），
  # 故整段可省略。⚠️ min_migrate_interval_ms / repin_debounce_ms / return_cooldown_ms
  # 三道时间闸是防 A→B→A 乒乓的护栏，钳制下界就是现值，**不得改小**。
  tuning:
    promote_util_pct: 25
    little_high_water: 0.70
    key_bind_release_water: 0.50
    fg_busy_util_pct: 30
    fg_busy_release_util_pct: 15
    little_promote_util_pct: 10
    big_high_water: 0.90
    demote_util_pct: 5
    demote_streak: 3
    pinned_weight: 0.4
    max_pins_per_core: 3
    overload_margin: 0.15
    core_overload_util: 0.70
    min_migrate_interval_ms: 4000
    repin_debounce_ms: 8000
    return_cooldown_ms: 16000
    thread_stale_secs: 30

# [corectl]
# core_ctl 核心在线接管（ChiRi 专属）
# boost 模式把各 cluster 的 min_cpus 抬到全组常在线，防厂商热插拔
# 与 ChiRi 调频打架；退出 boost 恢复快照。只动 min_cpus。
CoreCtl:
  # 总开关：false 时不写任何 core_ctl 节点
  enabled: true
  # scenemode 离线核（息屏深度省电）：进入 scenemode（息屏超过
  # scene_mode_delay_secs）后仅 prime（超大核）整簇断电消除空转漏电流，
  # 小核 + 大核全开常驻（频率上限由 scenemode CLG 配置压到 0.15 档），
  # 编号最大的小核独占给调度服务（从业务 cpuset 组移除 + 自身线程移入
  # 根组 + 自钉，后台任务堵塞不了调度服务）。常驻簇（小核+大核）util
  # 持续 10s 顶满 70% 视为饱和 → 自动退回 reduce 并进入 300s 冷却
  # （期间不得重进 scenemode）；重进前还须负载回落到阈值下方。亮屏/退出
  # 按快照恢复，维持期每 2s 纠偏（厂商偷拉起的核重新下线、框架加回
  # 保留核重新移除）。逐核回读验证，内核拒绝的核自动跳过。与 boost 互斥。
  # 8550/8475 建议 true；8998（内核 4.4 热插拔质量未知）建议 false。
  scenemode_offline: true

# [thermal]
# 热保护
# 电池温度是主参考（壳体发热由电池主导，温升慢但持续）；
# CPU 温度只在极端热时参与（内核 95°C 温控才是主力）。
# 豁免档 free_above：当前性能比已高于该值时不压制——高负载不挡路。
# 仅对 CLG 模式生效（vector/akmode 不受影响）。
# 温度输入经滤波（物理范围门 + 毛刺丢弃 + 3 样本中值 + 斜率限制）：
# soc_max 等合成温区读数跳变极大（实测 2s 内 ±25°C），不滤波会让 cap
# 以 ~8s 周期反复跳变（bang-bang 振荡，高负载游戏周期性卡顿）。
# 解除方向限速：压制加深立即生效，解除每 2s 最多 +0.15 逐级恢复。
Thermal:
  enabled: true
  # 电池软限（°C）：手机壳体开始发烫的临界点
  batt_soft_temp_c: 41
  # 电池硬限（°C）：手握明显发烫
  batt_hard_temp_c: 45
  # 电池中限（°C）：软/硬限之间再补一档，形成 1.0 → soft → mid → hard 四级阶梯
  # （必须 soft < mid < hard，越界由 normalize 钳到最近合法值并 warn）
  batt_mid_temp_c: 43
  # CPU 软限（°C）：接近内核温控起控点才参与。soc_max 在大型游戏高负载下
  # 常态 85°C+，阈值过低（如 75）会导致过半时间被软件压制、比官调更卡
  cpu_soft_temp_c: 90
  # CPU 硬限（°C）：极端情况才触发
  cpu_hard_temp_c: 95
  # CPU 中限（°C）：同样形成四级阶梯，只在极端热时参与（必须 soft < mid < hard）
  cpu_mid_temp_c: 92
  # 软限触发后压到的性能比例
  soft_perf_cap: 0.70
  # 中限触发后压到的性能比例（必须 mid <= soft、hard <= mid）
  mid_perf_cap: 0.60
  # 硬限触发后压到的性能比例（必须 <= mid_perf_cap）
  hard_perf_cap: 0.40
  # 豁免档：当前性能比已超过此值时不压制。默认 0.80
  free_above: 0.80
  # 软档回滞（°C）：退档要降到「软限 - hysteresis_c」以下才解除软限压制
  hysteresis_c: 3
  # 中档专用回滞（°C）：退档要降到「中限 - hysteresis_mid_c」以下才从中档退到软档。
  # normalize 强制不变量「本级解除点不得低于下一档跳闸点」→ 本值 > 中限-软限 时被钳到该上限并 warn
  hysteresis_mid_c: 2
  # 硬档专用回滞（°C）：退到「硬限 - hysteresis_hard_c」以下才从硬档退到中档；同受上条不变量约束
  hysteresis_hard_c: 2

# [modes]
# 性能模式（CLG 调频参数）
#
# 四档模式：reduce / default / boost / vector。
# 每档独立一组 cpu_load_governor 参数，结构完全相同。
#
# CLG 调频语义（动态上限）：
#   接管时 min 压到硬件最低，之后只写 max（性能上限）。
#   schedutil 在 [min, max] 内按瞬时负载自主调频——空闲时降到地板，
#   忙碌时贴近 max。不用等 160ms tick 才降频，内核微秒级就降下来，
#   空转发热比锁频方案小很多。
#
#   perf_floor / perf_ceil / perf_init 约束的是"上限"，
#   实际空闲频率由 schedutil 自己决定。
#
# vector 模式不走 CLG：min=max=硬件最高频硬锁，见 src/chiri/fast.rs。

# 替换成 reduce / default / boost
reduce:
  cpu_load_governor:
    # 升频阈值：cluster 最大 util >= 此值时进入升频区间（0..1）
    # 调大更难触发升频，省电但响应慢
    up_threshold: 0.85

    # 降频阈值：util 跌破此值进入降频区间（0..1）
    # 调小更难降频，性能维持更好但更耗电
    down_threshold: 0.60

    # 升频平滑系数（0..1）：每 tick 目标性能只逼近该比例
    # 大 = 升频快、响应迅速，小 = 平滑、不跳变
    smoothing_up: 0.40

    # 决策负载平滑（EMA 系数，0..1，1.0 = 关闭）：滤掉抖动负载的单 tick 摆动，
    # 抑制决策方向反复翻转与 scaling_max_freq 高频改写；小 = 更平滑但响应略慢。
    # 勿设 0：0 = 负载冻结在首个采样值，决策完全不随负载变化
    util_smoothing: 0.5

    # 降频速率限制（tick 数）：连续满足降频条件才执行一次
    # 调大降频更谨慎，防短暂波动导致频繁降频
    down_rate_limit_ticks: 2

    # 升频速率限制（tick 数）：连续满足升频条件才执行一次
    up_rate_limit_ticks: 2

    # 性能余量因子（>=1）：util 达 up_threshold 后目标性能放大此系数
    # 给突发负载预留频率余量，调大余量大、功耗高
    headroom_factor: 1.10

    # headroom 过渡带宽度（0..1）：up_threshold 附近线性渐变，
    # 避免到达阈值时性能突然阶跃
    headroom_ramp: 0.15

    # 性能下限（0..1）：目标性能永不低于此值
    # 保底频率，调高卡顿少但功耗大。必须 <= perf_ceil
    perf_floor: 0.10

    # 性能上限（0..1）：目标性能永不高于此值。**除 SceneMode 外不许设 < 1.0**
    # （天花板全拆口径：省电靠门槛 + 升频速率 + 下方 steady_decay_*，不靠砍上限——
    #   砍了就等于持续满负载也到不了硬件最高频）。必须 >= perf_floor
    perf_ceil: 1.0

    # ---- 稳态下探（T11）：天花板拆掉后的稳态降功耗手段，缺省开启 ----
    # 语义 = 对「写侧性能偏移」的限幅积分控制，被控量是 util：
    #   T = up_threshold × steady_decay_target_ratio
    #   util > T + band → 回收下探（步长 ×2，防过冲）
    #   util < T − band → 加深下探（步长 steady_decay_step）
    #   死区内保持不变（消除抖动）
    # 只在连续稳定 steady_decay_stable_ticks 后才开始；负载上行 / util ≥ up_threshold /
    # 极低负载立即清零。偏移只作用于「将要写入的上限」，不回写决策状态 → 自限、不振荡。
    # 取点提示：boost（对功耗宽松的档）应显式 false——其 up_threshold 偏低（0.55~0.65），
    # T 会落进常态负载区间、把常态负载一起下探、削掉响应优势（8550/8475/8998/根兜底均已显式关闭）。
    steady_decay_enabled: true # 总开关
    steady_decay_target_ratio: 0.90 # 目标水位系数（0.5..1.0）
    steady_decay_band: 0.05 # 稳定带 + 目标水位保持死区（0..0.3）
    steady_decay_stable_ticks: 12 # 连续稳定多少 tick 才启动（1..600；8550 ≈160ms/tick → 约 2s）
    steady_decay_step: 0.01 # 每次加深的步长（0..0.1）
    steady_decay_max: 0.20 # 下探量上限（0..0.5，抗积分饱和）

    # 初始性能（0..1）：CLG 接管瞬间的起点
    # 避免从 0 爬升导致开机卡。必须在 [perf_floor, perf_ceil] 内
    perf_init: 0.30

    # 升频快速通道：target_perf 超过 current_perf 幅度大于此值时直接升
    # 应对冷启动等负载突增
    up_jump_threshold: 0.35

    # 滞回带升频缩放（0..1）：滞回带内靠近 down_threshold 端升频更慢
    # 调小低负载端更保守，更省电
    slow_up_scale: 0.02

    # 极低负载阈值（0..1）：util 低于此值时跳过降频防抖、立即降频
    # 息屏或空闲时迅速拉低频率
    down_fast_threshold: 0.10

    # 尖峰抑制阈值（0..1）：单 tick util 跳升超此值时衰减增量
    # 防止孤立尖峰瞬间拉满频率
    spike_jump_threshold: 0.35

    # 尖峰衰减比例（0..1）：增量保留比例
    # 0 = 完全抑制，1 = 不抑制
    spike_decay: 0.30

    # 触摸升频开关：触摸时抬高大核性能上限，窗口内锁定
    touch_boost_enabled: true
    # 触摸升频窗口（ms）：触摸后大核保持抬高状态的时长
    touch_boost_ms: 400
    # 触摸升频档数：在可用频率表中向上移动的档数
    touch_boost_tiers: 1
